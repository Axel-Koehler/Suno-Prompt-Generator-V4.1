  <title>AK AI Music Studio</title>
  <style>
    :root {
      --bg: #070812;
      --cyan: #00d9ff;
      --magenta: #ff2dfd;
      --violet: #6736ff;
      --yellow: #f8ff13;
      --orange: #ff9f1c;
      --text: #f7fbff;
      --muted: #9da7d7;
      --shadow: 0 0 24px rgba(103, 54, 255, 0.45), 0 0 48px rgba(255, 45, 253, 0.24);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      overflow-x: hidden;
    }

    textarea {
      font: inherit;
    }

    .home-stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: 24px 26px;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(5, 7, 20, 0.58), rgba(5, 7, 20, 0.86)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.07), rgba(255, 45, 253, 0.11), rgba(248, 255, 19, 0.05));
    }

    .home-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 5px),
        linear-gradient(180deg, rgba(3, 4, 14, 0.08), rgba(3, 4, 14, 0.64));
      pointer-events: none;
      z-index: -2;
    }

    .home-shell {
      --shell-corner-depth: clamp(78px, 10vh, 112px);
      position: relative;
      width: min(1180px, 96vw);
      min-height: min(760px, calc(100vh - 48px));
      padding: 10px 22px 58px;
      clip-path: polygon(4.5% 0, 95.5% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 95.5% 100%, 4.5% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      background:
        linear-gradient(90deg, var(--yellow), var(--orange) 9%, var(--violet) 23%, var(--magenta) 51%, var(--violet) 76%, var(--cyan) 91%, var(--yellow)),
        linear-gradient(180deg, rgba(17, 8, 47, 0.96), rgba(5, 5, 18, 0.98));
      box-shadow: var(--shadow);
    }

    .home-shell::before {
      content: "";
      position: absolute;
      inset: 3px;
      clip-path: inherit;
      background:
        linear-gradient(180deg, rgba(10, 6, 29, 0.95), rgba(8, 5, 24, 0.98)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.08), rgba(255, 45, 253, 0.08));
      z-index: -1;
    }

    .home-shell::after {
      content: "";
      position: absolute;
      left: 9%;
      right: 9%;
      top: 50%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--yellow), #ff64ff 50%, var(--cyan), transparent);
      box-shadow: 0 0 16px rgba(255, 45, 253, 0.9), 0 0 32px rgba(0, 217, 255, 0.5);
      opacity: 0.5;
      pointer-events: none;
    }

    .home-title {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }

    .home-title-chip {
      position: relative;
      min-width: 380px;
      padding: 13px 34px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: rgba(247, 251, 255, 0.96);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0;
      background:
        linear-gradient(135deg, var(--yellow) 0 12px, transparent 12px) left top / 34px 34px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 12px, transparent 12px) right top / 34px 34px no-repeat,
        linear-gradient(45deg, #ff8a19 0 10px, transparent 10px) left bottom / 30px 30px no-repeat,
        linear-gradient(315deg, #ff8a19 0 10px, transparent 10px) right bottom / 30px 30px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.88), rgba(9, 14, 42, 0.96));
      border: 1px solid rgba(0, 217, 255, 0.8);
      box-shadow:
        0 0 26px rgba(0, 217, 255, 0.52),
        0 0 34px rgba(175, 25, 255, 0.36),
        inset 0 0 16px rgba(0, 217, 255, 0.28);
      clip-path: polygon(7% 0, 93% 0, 100% 50%, 93% 100%, 7% 100%, 0 50%);
      text-shadow: 0 0 12px rgba(0, 217, 255, 0.78);
      white-space: nowrap;
      isolation: isolate;
      overflow: hidden;
    }

    .home-title-chip::before {
      content: "";
      position: absolute;
      inset: 5px 12px;
      border-top: 1px solid rgba(198, 31, 255, 0.78);
      border-bottom: 1px solid rgba(198, 31, 255, 0.78);
      clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%);
      box-shadow: inset 0 0 14px rgba(198, 31, 255, 0.32);
      pointer-events: none;
    }

    .home-subline {
      color: rgba(247, 251, 255, 0.88);
      font-size: 14px;
      text-transform: none;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.45);
    }

    .home-fields {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 980px;
      margin: 0 auto;
    }

    .home-field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .home-field span {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 400;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.42);
    }

    .home-text {
      width: 100%;
      min-height: 142px;
      resize: vertical;
      padding: 13px;
      border: 1px solid rgba(0, 217, 255, 0.42);
      border-radius: 6px;
      color: rgba(247, 251, 255, 0.9);
      background: rgba(2, 5, 20, 0.62);
      box-shadow: inset 0 0 18px rgba(0, 217, 255, 0.07);
      font-size: 13px;
      line-height: 1.45;
      text-transform: none;
    }

    @media (max-width: 820px) {
      .home-stage {
        padding: 18px 12px 12px;
      }

      .home-shell {
        --shell-corner-depth: 42px;
        width: min(100%, 96vw);
        padding: 10px 14px 44px;
        clip-path: polygon(3% 0, 97% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 97% 100%, 3% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      }

      .home-title-chip {
        min-width: 0;
        width: 100%;
      }

      .home-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
