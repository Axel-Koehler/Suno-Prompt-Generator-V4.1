<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="assets/site-nav.css">
  <script src="assets/remote-config.js"></script>
  <script src="assets/remote-store.js"></script>
  <script src="assets/site-nav.js" defer></script>
  <script src="assets/site-content.js" defer></script>
  <title>Editor</title>
  <style>
    :root {
      --bg: #070812;
      --cyan: #00d9ff;
      --magenta: #ff2dfd;
      --violet: #6736ff;
      --yellow: #f8ff13;
      --orange: #ff9f1c;
      --text: #f7fbff;
      --muted: #9da7d7;
      --panel: rgba(14, 7, 35, 0.78);
      --shadow: 0 0 24px rgba(103, 54, 255, 0.45), 0 0 48px rgba(255, 45, 253, 0.24);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      font-weight: 400;
    }

    .editor-stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: 24px 26px;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(5, 7, 20, 0.58), rgba(5, 7, 20, 0.86)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.07), rgba(255, 45, 253, 0.11), rgba(248, 255, 19, 0.05));
    }

    .editor-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 5px),
        linear-gradient(180deg, rgba(3, 4, 14, 0.08), rgba(3, 4, 14, 0.64));
      pointer-events: none;
      z-index: -2;
    }

    .editor-shell {
      --shell-corner-depth: clamp(78px, 10vh, 112px);
      position: relative;
      width: min(1180px, 96vw);
      min-height: min(760px, calc(100vh - 48px));
      padding: 10px 22px 58px;
      clip-path: polygon(4.5% 0, 95.5% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 95.5% 100%, 4.5% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      background:
        linear-gradient(90deg, var(--yellow), var(--orange) 9%, var(--violet) 23%, var(--magenta) 51%, var(--violet) 76%, var(--cyan) 91%, var(--yellow)),
        linear-gradient(180deg, rgba(17, 8, 47, 0.96), rgba(5, 5, 18, 0.98));
      box-shadow: var(--shadow);
    }

    .editor-shell::before {
      content: "";
      position: absolute;
      inset: 3px;
      clip-path: inherit;
      background:
        linear-gradient(180deg, rgba(10, 6, 29, 0.95), rgba(8, 5, 24, 0.98)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.08), rgba(255, 45, 253, 0.08));
      z-index: -1;
    }

    .editor-title {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }

    .editor-title-chip {
      position: relative;
      min-width: 320px;
      padding: 13px 34px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(247, 251, 255, 0.96);
      font-weight: 400;
      text-transform: uppercase;
      background:
        linear-gradient(135deg, var(--yellow) 0 12px, transparent 12px) left top / 34px 34px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 12px, transparent 12px) right top / 34px 34px no-repeat,
        linear-gradient(45deg, #ff8a19 0 10px, transparent 10px) left bottom / 30px 30px no-repeat,
        linear-gradient(315deg, #ff8a19 0 10px, transparent 10px) right bottom / 30px 30px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.88), rgba(9, 14, 42, 0.96));
      border: 1px solid rgba(0, 217, 255, 0.8);
      clip-path: polygon(7% 0, 93% 0, 100% 50%, 93% 100%, 7% 100%, 0 50%);
      box-shadow: 0 0 26px rgba(0, 217, 255, 0.52), inset 0 0 16px rgba(0, 217, 255, 0.28);
      text-shadow: 0 0 12px rgba(0, 217, 255, 0.78);
    }

    .editor-subline {
      color: rgba(247, 251, 255, 0.88);
      font-size: 14px;
      text-transform: none;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.45);
    }

    .editor-content {
      position: relative;
      z-index: 2;
      max-width: 980px;
      margin: 0 auto;
    }

    .login-panel,
    .editor-panel {
      border: 1px solid rgba(0, 217, 255, 0.42);
      border-radius: 6px;
      background: rgba(2, 5, 20, 0.62);
      box-shadow: inset 0 0 18px rgba(0, 217, 255, 0.07);
    }

    .login-panel {
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .editor-panel {
      display: none;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }

    .editor-panel.is-open {
      display: grid;
    }

    .field-list {
      display: grid;
      gap: 8px;
      align-content: start;
      padding-right: 4px;
    }

    .field-list button {
      min-height: 44px;
      padding: 10px 12px;
      color: rgba(247, 251, 255, 0.92);
      text-align: left;
      text-transform: none;
      background: rgba(13, 17, 50, 0.84);
      border: 1px solid rgba(0, 217, 255, 0.32);
      border-radius: 6px;
      cursor: pointer;
    }

    .field-list button.is-active {
      color: var(--yellow);
      border-color: rgba(248, 255, 19, 0.86);
      box-shadow: 0 0 18px rgba(248, 255, 19, 0.16);
    }

    .field-page {
      display: block;
      margin-bottom: 3px;
      color: var(--cyan);
      font-size: 11px;
      text-transform: uppercase;
    }

    .form-area {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .editor-label {
      display: grid;
      gap: 6px;
      color: var(--cyan);
      font-size: 12px;
    }

    .editor-input,
    .editor-textarea {
      width: 100%;
      color: rgba(247, 251, 255, 0.94);
      background: rgba(2, 5, 20, 0.72);
      border: 1px solid rgba(0, 217, 255, 0.42);
      border-radius: 6px;
      outline: none;
      text-transform: none;
      box-shadow: inset 0 0 16px rgba(0, 217, 255, 0.06);
    }

    .editor-input {
      min-height: 40px;
      padding: 8px 10px;
    }

    .editor-textarea {
      min-height: 320px;
      padding: 12px;
      resize: vertical;
      line-height: 1.45;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .color-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: end;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .record-entry-panel {
      display: grid;
      gap: 12px;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid rgba(0, 217, 255, 0.42);
      border-radius: 6px;
      background: rgba(2, 5, 20, 0.46);
      box-shadow: inset 0 0 18px rgba(0, 217, 255, 0.06);
    }

    .record-entry-title {
      margin: 0;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 400;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.42);
    }

    .record-entry-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .record-entry-grid .wide {
      grid-column: 1 / -1;
    }

    .record-entry-panel .editor-textarea {
      min-height: 130px;
    }

    .record-manager-grid {
      display: grid;
      grid-template-columns: minmax(220px, 0.42fr) minmax(0, 0.58fr);
      gap: 12px;
      align-items: start;
    }

    .record-manager-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-color: rgba(0, 217, 255, 0.64) rgba(2, 5, 20, 0.48);
      scrollbar-width: thin;
    }

    .record-manager-list button {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      color: rgba(247, 251, 255, 0.92);
      text-align: left;
      text-transform: none;
      background: rgba(13, 17, 50, 0.84);
      border: 1px solid rgba(0, 217, 255, 0.32);
      border-radius: 6px;
      cursor: pointer;
    }

    .record-manager-list button.is-active {
      color: var(--yellow);
      border-color: rgba(248, 255, 19, 0.86);
      box-shadow: 0 0 18px rgba(248, 255, 19, 0.16);
    }

    .record-manager-meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      text-transform: none;
    }

    .record-manager-empty {
      margin: 0;
      padding: 10px 12px;
      color: rgba(247, 251, 255, 0.78);
      text-transform: none;
      border: 1px solid rgba(0, 217, 255, 0.24);
      border-radius: 6px;
      background: rgba(2, 5, 20, 0.38);
    }

    .button {
      min-height: 40px;
      padding: 9px 16px;
      color: rgba(247, 251, 255, 0.94);
      text-transform: uppercase;
      background: linear-gradient(180deg, rgba(255, 45, 253, 0.28), rgba(103, 54, 255, 0.18));
      border: 1px solid rgba(255, 45, 253, 0.66);
      border-radius: 5px;
      cursor: pointer;
      box-shadow: inset 0 0 14px rgba(255, 45, 253, 0.12);
    }

    .button:hover,
    .button:focus-visible {
      border-color: rgba(248, 255, 19, 0.9);
      outline: none;
    }

    .status {
      min-height: 18px;
      color: var(--yellow);
      font-size: 12px;
      text-transform: none;
    }

    .is-hidden {
      display: none;
    }

    @media (max-width: 820px) {
      .editor-stage {
        padding: 18px 12px 12px;
      }

      .editor-shell {
        --shell-corner-depth: 42px;
        width: min(100%, 96vw);
        padding: 10px 14px 44px;
        clip-path: polygon(3% 0, 97% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 97% 100%, 3% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      }

      .editor-title-chip {
        min-width: 0;
        width: 100%;
      }

      .editor-panel.is-open {
        grid-template-columns: 1fr;
      }

      .control-row {
        grid-template-columns: 1fr;
      }

      .record-manager-grid,
      .record-entry-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="editor-stage">
    <section class="editor-shell" aria-label="Editor">
      <div class="editor-title">
        <div class="editor-title-chip">Editor</div>
        <div class="editor-subline">Texte und Darstellung bearbeiten</div>
      </div>

      <nav class="site-nav" data-active="editor" aria-label="Hauptnavigation"></nav>

      <div class="editor-content">
        <form class="login-panel" id="loginForm" autocomplete="off">
          <label class="editor-label">
            Benutzername
            <input class="editor-input" id="username" type="text" autocomplete="username">
          </label>
          <label class="editor-label">
            Passwort
            <input class="editor-input" id="password" type="password" autocomplete="current-password">
          </label>
          <button class="button" type="submit">Anmelden</button>
          <div class="status" id="loginStatus"></div>
        </form>

        <section class="editor-panel" id="editorPanel" aria-label="Texteditor">
          <div>
            <label class="editor-label">
              Textfelder
              <div class="field-list" id="fieldList"></div>
            </label>
          </div>

          <div class="form-area">
            <label class="editor-label">
              Ausgewähltes Textfeld
              <input class="editor-input" id="fieldName" type="text" readonly>
            </label>

            <label class="editor-label">
              Text
              <textarea class="editor-textarea" id="fieldText" spellcheck="false"></textarea>
            </label>

            <div class="control-row">
              <label class="editor-label">
                Schriftgröße
                <input class="editor-input" id="fontSize" type="number" min="10" max="48" step="1">
              </label>
              <label class="editor-label">
                Schriftfarbe
                <div class="color-control">
                  <select class="editor-input" id="colorPreset">
                    <option value="#f7fbff">Text Weiß</option>
                    <option value="#00d9ff">Neon Cyan</option>
                    <option value="#f8ff13">Neon Gelb</option>
                    <option value="#ff2dfd">Neon Magenta</option>
                    <option value="#6736ff">Violett</option>
                    <option value="#ff9f1c">Orange</option>
                    <option value="#9da7d7">Gedämpft Blau</option>
                    <option value="#ffffff">Rein Weiß</option>
                    <option value="">Eigene Farbe</option>
                  </select>
                  <input class="editor-input" id="fontColor" type="color">
                </div>
              </label>
              <label class="editor-label">
                Textausrichtung
                <select class="editor-input" id="textAlign">
                  <option value="">Standard</option>
                  <option value="left">Links</option>
                  <option value="center">Zentriert</option>
                  <option value="right">Rechts</option>
                  <option value="justify">Blocksatz</option>
                </select>
              </label>
            </div>

            <div class="action-row">
              <button class="button" id="bulletButton" type="button">Aufzählung</button>
              <button class="button" id="saveButton" type="button">Speichern</button>
              <button class="button" id="resetButton" type="button">Feld zurücksetzen</button>
              <button class="button" id="resetAllButton" type="button">Alles zurücksetzen</button>
              <button class="button" id="logoutButton" type="button">Abmelden</button>
            </div>
            <div class="status" id="editorStatus"></div>

            <section class="record-entry-panel" aria-label="Neuer Datensatz Projekt 1">
              <h2 class="record-entry-title">Neuen Datensatz für Projekt 1 hinzufügen</h2>
              <div class="record-entry-grid">
                <label class="editor-label">
                  Jahr
                  <input class="editor-input" id="recordYear" type="text" inputmode="numeric">
                </label>
                <label class="editor-label">
                  Interpret
                  <input class="editor-input" id="recordInterpreter" type="text">
                </label>
                <label class="editor-label">
                  Genre
                  <input class="editor-input" id="recordGenre" type="text">
                </label>
                <label class="editor-label">
                  Mood
                  <input class="editor-input" id="recordMood" type="text">
                </label>
                <label class="editor-label wide">
                  Style
                  <textarea class="editor-textarea" id="recordStyle" spellcheck="false"></textarea>
                </label>
              </div>
              <div class="action-row">
                <button class="button" id="recordSaveButton" type="button">Datensatz speichern</button>
                <button class="button" id="recordClearButton" type="button">Felder leeren</button>
              </div>
              <div class="status" id="recordStatus"></div>
            </section>

            <section class="record-entry-panel" aria-label="Datensätze Projekt 1 bearbeiten">
              <h2 class="record-entry-title">Datensätze Projekt 1 bearbeiten</h2>
              <div class="record-manager-grid">
                <label class="editor-label">
                  Datensatzliste
                  <input class="editor-input" id="projectRecordSearch" type="search" placeholder="Datensätze suchen">
                  <div class="record-manager-list" id="projectRecordList"></div>
                </label>

                <div class="record-entry-grid">
                  <label class="editor-label">
                    Jahr
                    <input class="editor-input" id="editRecordYear" type="text" inputmode="numeric">
                  </label>
                  <label class="editor-label">
                    Interpret
                    <input class="editor-input" id="editRecordInterpreter" type="text">
                  </label>
                  <label class="editor-label">
                    Genre
                    <input class="editor-input" id="editRecordGenre" type="text">
                  </label>
                  <label class="editor-label">
                    Mood
                    <input class="editor-input" id="editRecordMood" type="text">
                  </label>
                  <label class="editor-label wide">
                    Style
                    <textarea class="editor-textarea" id="editRecordStyle" spellcheck="false"></textarea>
                  </label>
                  <div class="action-row wide">
                    <button class="button" id="recordUpdateButton" type="button">Änderung speichern</button>
                    <button class="button" id="recordDeleteButton" type="button">Datensatz löschen</button>
                  </div>
                  <div class="status wide" id="recordEditStatus"></div>
                </div>
              </div>
            </section>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const USERNAME = "Axel";
      const PASSWORD = "416114";
      const AUTH_KEY = "ak-ai-music-editor-auth-v1";
      let activeField = null;

      const loginForm = document.getElementById("loginForm");
      const loginStatus = document.getElementById("loginStatus");
      const editorPanel = document.getElementById("editorPanel");
      const fieldList = document.getElementById("fieldList");
      const fieldName = document.getElementById("fieldName");
      const fieldText = document.getElementById("fieldText");
      const fontSize = document.getElementById("fontSize");
      const colorPreset = document.getElementById("colorPreset");
      const fontColor = document.getElementById("fontColor");
      const textAlign = document.getElementById("textAlign");
      const editorStatus = document.getElementById("editorStatus");
      const recordStatus = document.getElementById("recordStatus");
      const projectRecordList = document.getElementById("projectRecordList");
      const projectRecordSearch = document.getElementById("projectRecordSearch");
      const recordEditStatus = document.getElementById("recordEditStatus");
      const recordUpdateButton = document.getElementById("recordUpdateButton");
      const recordDeleteButton = document.getElementById("recordDeleteButton");
      const presetColors = Array.from(colorPreset.options).map((option) => option.value).filter(Boolean);
      const projectRecordStorageKey = "suno-prompt-menu-records-xlsx-txt-v1";
      const projectCustomRecordStorageKey = "suno-prompt-menu-custom-records-v1";
      let activeProjectRecordId = "";
      let projectRecordsCache = [];

      const readJson = (key) => {
        try {
          return JSON.parse(localStorage.getItem(key) || "{}");
        } catch (error) {
          return {};
        }
      };

      const writeJson = (key, value) => {
        localStorage.setItem(key, JSON.stringify(value));
      };

      const saveProjectCustomRecordsRemote = async (records) => {
        if (!window.AKRemoteStore?.isConfigured) return false;
        return window.AKRemoteStore.set(projectCustomRecordStorageKey, records);
      };

      const saveProjectRecordsRemote = async (records) => {
        if (!window.AKRemoteStore?.isConfigured) return false;
        return window.AKRemoteStore.set(projectRecordStorageKey, records);
      };

      const cleanValue = (value) => String(value || "").trim().replace(/\s+/g, " ");

      const recordKey = (record) => ["Jahr", "Interpret", "Genre", "Mood", "Style"]
        .map((column) => cleanValue(record[column]).toLocaleLowerCase("de"))
        .join("|");

      const clearRecordForm = () => {
        ["recordYear", "recordInterpreter", "recordGenre", "recordMood", "recordStyle"].forEach((id) => {
          document.getElementById(id).value = "";
        });
      };

      const mergeRecords = (records, customRecords) => {
        const merged = records.slice();
        const seen = new Set(merged.map(recordKey));
        customRecords.forEach((record) => {
          const key = recordKey(record);
          if (seen.has(key)) return;
          seen.add(key);
          merged.push(record);
        });
        return merged;
      };

      const normalizeProjectIds = (records, prefix = "R") => {
        records.forEach((record, index) => {
          record._id = prefix + String(index + 1).padStart(4, "0");
        });
      };

      const loadProjectCustomRecords = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(projectCustomRecordStorageKey) || "[]");
          return Array.isArray(saved) ? saved : [];
        } catch (error) {
          localStorage.removeItem(projectCustomRecordStorageKey);
          return [];
        }
      };

      const loadProjectCustomRecordsRemote = async () => {
        const localRecords = loadProjectCustomRecords();
        if (!window.AKRemoteStore?.isConfigured) return localRecords;
        const remoteRecords = await window.AKRemoteStore.get(projectCustomRecordStorageKey, null);
        if (Array.isArray(remoteRecords)) {
          const mergedRecords = mergeRecords(localRecords, remoteRecords);
          localStorage.setItem(projectCustomRecordStorageKey, JSON.stringify(mergedRecords));
          if (mergedRecords.length !== remoteRecords.length) await saveProjectCustomRecordsRemote(mergedRecords);
          return mergedRecords;
        }
        if (localRecords.length) await saveProjectCustomRecordsRemote(localRecords);
        return localRecords;
      };

      const loadProjectRecordsRemote = async () => {
        if (!window.AKRemoteStore?.isConfigured) return null;
        const remoteRecords = await window.AKRemoteStore.get(projectRecordStorageKey, null);
        return Array.isArray(remoteRecords) && remoteRecords.length ? remoteRecords : null;
      };

      const loadProjectDefaults = () => new Promise((resolve) => {
        const iframe = document.createElement("iframe");
        iframe.className = "is-hidden";
        iframe.src = "outputs/suno_auswahlmenue.html";
        iframe.addEventListener("load", () => {
          try {
            const source = iframe.contentWindow.SunoPromptRecords;
            resolve(Array.isArray(source.initialRecords) ? source.initialRecords : []);
          } catch (error) {
            resolve([]);
          } finally {
            iframe.remove();
          }
        });
        iframe.addEventListener("error", () => {
          iframe.remove();
          resolve([]);
        });
        document.body.appendChild(iframe);
      });

      const loadProjectRecords = async () => {
        const customRecords = await loadProjectCustomRecordsRemote();
        const remoteRecords = await loadProjectRecordsRemote();
        if (remoteRecords) return mergeRecords(remoteRecords, customRecords);
        try {
          const saved = JSON.parse(localStorage.getItem(projectRecordStorageKey) || "[]");
          if (Array.isArray(saved) && saved.length) return mergeRecords(saved, customRecords);
        } catch (error) {
          localStorage.removeItem(projectRecordStorageKey);
        }
        return mergeRecords(await loadProjectDefaults(), customRecords);
      };

      const customRecordsFromProjectRecords = (records, defaultIds) => {
        return records.filter((record) => !defaultIds.has(record._id));
      };

      const getProjectRecordForm = () => ({
        _sourceRow: "Editor",
        _id: activeProjectRecordId,
        Jahr: cleanValue(document.getElementById("editRecordYear").value).replace(/^(\d{3,4})s$/i, "$1"),
        Interpret: cleanValue(document.getElementById("editRecordInterpreter").value),
        Genre: cleanValue(document.getElementById("editRecordGenre").value),
        Mood: cleanValue(document.getElementById("editRecordMood").value),
        Style: cleanValue(document.getElementById("editRecordStyle").value),
      });

      const clearProjectRecordEditor = () => {
        activeProjectRecordId = "";
        ["editRecordYear", "editRecordInterpreter", "editRecordGenre", "editRecordMood", "editRecordStyle"].forEach((id) => {
          document.getElementById(id).value = "";
        });
        recordUpdateButton.disabled = true;
        recordDeleteButton.disabled = true;
        projectRecordList.querySelectorAll("button").forEach((button) => button.classList.remove("is-active"));
      };

      const persistProjectRecords = async (records) => {
        const defaults = await loadProjectDefaults();
        const defaultIds = new Set(defaults.map((record) => record._id));
        const fullRecords = records.map((record) => ({ ...record }));
        localStorage.setItem(projectRecordStorageKey, JSON.stringify(fullRecords));
        const customRecords = customRecordsFromProjectRecords(fullRecords, defaultIds);
        localStorage.setItem(projectCustomRecordStorageKey, JSON.stringify(customRecords));
        const fullSaved = await saveProjectRecordsRemote(fullRecords);
        await saveProjectCustomRecordsRemote(customRecords);
        projectRecordsCache = fullRecords.map((record) => ({ ...record }));
        renderProjectRecordList();
        return fullSaved;
      };

      const projectRecordLabel = (record) => {
        const title = [record.Interpret, record.Jahr].filter(Boolean).join(" - ");
        const meta = [record.Genre, record.Mood].filter(Boolean).join(" · ");
        return { title: title || "Ohne Titel", meta };
      };

      const recordMatchesSearch = (record, query) => {
        if (!query) return true;
        const searchable = ["Jahr", "Interpret", "Genre", "Mood", "Style"]
          .map((column) => cleanValue(record[column]))
          .join(" ")
          .toLocaleLowerCase("de");
        return searchable.includes(query);
      };

      const selectProjectRecord = (recordId) => {
        const record = projectRecordsCache.find((entry) => entry._id === recordId);
        if (!record) return;
        activeProjectRecordId = record._id;
        document.getElementById("editRecordYear").value = record.Jahr || "";
        document.getElementById("editRecordInterpreter").value = record.Interpret || "";
        document.getElementById("editRecordGenre").value = record.Genre || "";
        document.getElementById("editRecordMood").value = record.Mood || "";
        document.getElementById("editRecordStyle").value = record.Style || "";
        recordUpdateButton.disabled = false;
        recordDeleteButton.disabled = false;
        recordEditStatus.textContent = "";
        projectRecordList.querySelectorAll("button").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.recordId === recordId);
        });
      };

      const renderProjectRecordList = () => {
        projectRecordList.innerHTML = "";
        const query = cleanValue(projectRecordSearch.value).toLocaleLowerCase("de");
        const sortedRecords = projectRecordsCache.filter((record) => recordMatchesSearch(record, query)).sort((left, right) => {
          const leftLabel = [left.Interpret, left.Jahr, left.Genre].join(" ");
          const rightLabel = [right.Interpret, right.Jahr, right.Genre].join(" ");
          return leftLabel.localeCompare(rightLabel, "de", { sensitivity: "base" });
        });

        if (!sortedRecords.length) {
          const empty = document.createElement("p");
          empty.className = "record-manager-empty";
          empty.textContent = query ? "Keine Datensätze zur Suche gefunden." : "Noch keine Datensätze vorhanden.";
          projectRecordList.appendChild(empty);
          if (!projectRecordsCache.some((record) => record._id === activeProjectRecordId)) clearProjectRecordEditor();
          return;
        }

        sortedRecords.forEach((record) => {
          const button = document.createElement("button");
          const label = projectRecordLabel(record);
          const meta = document.createElement("span");
          button.type = "button";
          button.dataset.recordId = record._id;
          button.textContent = label.title;
          meta.className = "record-manager-meta";
          meta.textContent = label.meta;
          button.appendChild(meta);
          button.classList.toggle("is-active", record._id === activeProjectRecordId);
          button.addEventListener("click", () => selectProjectRecord(record._id));
          projectRecordList.appendChild(button);
        });

        if (!activeProjectRecordId || !projectRecordsCache.some((record) => record._id === activeProjectRecordId)) {
          clearProjectRecordEditor();
        }
      };

      const refreshProjectRecordList = async () => {
        const records = await loadProjectRecords();
        projectRecordsCache = records.map((record) => ({ ...record }));
        localStorage.setItem(projectRecordStorageKey, JSON.stringify(projectRecordsCache));
        renderProjectRecordList();
      };

      const updateProjectRecord = async () => {
        if (!activeProjectRecordId) {
          recordEditStatus.textContent = "Bitte zuerst einen Datensatz auswählen.";
          return;
        }

        const nextRecord = getProjectRecordForm();
        if (!nextRecord.Jahr || !nextRecord.Interpret || !nextRecord.Genre || !nextRecord.Mood || !nextRecord.Style) {
          recordEditStatus.textContent = "Bitte alle Datensatzfelder ausfüllen.";
          return;
        }

        const projectRecords = projectRecordsCache.map((record) => ({ ...record }));
        const recordIndex = projectRecords.findIndex((record) => record._id === activeProjectRecordId);
        if (recordIndex === -1) {
          recordEditStatus.textContent = "Datensatz wurde nicht gefunden.";
          return;
        }

        const currentRecordKey = recordKey(projectRecords[recordIndex]);
        const duplicate = projectRecords.some((record, index) => {
          const key = recordKey(record);
          return index !== recordIndex && key !== currentRecordKey && key === recordKey(nextRecord);
        });
        if (duplicate) {
          recordEditStatus.textContent = "Dieser Datensatz ist bereits vorhanden.";
          return;
        }

        projectRecords[recordIndex] = nextRecord;
        const remoteSaved = await persistProjectRecords(projectRecords);
        selectProjectRecord(nextRecord._id);
        recordEditStatus.textContent = window.AKRemoteStore?.isConfigured
          ? (remoteSaved ? "Datensatz zentral gespeichert." : "Lokal gespeichert. Online-Speicher nicht erreichbar.")
          : "Datensatz lokal gespeichert.";
      };

      const deleteProjectRecord = async () => {
        if (!activeProjectRecordId) {
          recordEditStatus.textContent = "Bitte zuerst einen Datensatz auswählen.";
          return;
        }
        const record = projectRecordsCache.find((entry) => entry._id === activeProjectRecordId);
        if (!record) return;
        const label = projectRecordLabel(record).title;
        if (!window.confirm('Datensatz "' + label + '" wirklich löschen?')) return;

        const projectRecords = projectRecordsCache
          .filter((entry) => entry._id !== activeProjectRecordId)
          .map((entry) => ({ ...entry }));
        const remoteSaved = await persistProjectRecords(projectRecords);
        clearProjectRecordEditor();
        recordEditStatus.textContent = window.AKRemoteStore?.isConfigured
          ? (remoteSaved ? "Datensatz zentral gelöscht." : "Lokal gelöscht. Online-Speicher nicht erreichbar.")
          : "Datensatz lokal gelöscht.";
      };

      const saveProjectRecord = async () => {
        const nextRecord = {
          _sourceRow: "Editor",
          Jahr: cleanValue(document.getElementById("recordYear").value).replace(/^(\d{3,4})s$/i, "$1"),
          Interpret: cleanValue(document.getElementById("recordInterpreter").value),
          Genre: cleanValue(document.getElementById("recordGenre").value),
          Mood: cleanValue(document.getElementById("recordMood").value),
          Style: cleanValue(document.getElementById("recordStyle").value),
        };

        if (!nextRecord.Jahr || !nextRecord.Interpret || !nextRecord.Genre || !nextRecord.Mood || !nextRecord.Style) {
          recordStatus.textContent = "Bitte alle Datensatzfelder ausfüllen.";
          return;
        }

        const records = await loadProjectRecords();
        const duplicate = records.some((record) => recordKey(record) === recordKey(nextRecord));

        if (duplicate) {
          recordStatus.textContent = "Dieser Datensatz ist bereits vorhanden.";
          return;
        }

        nextRecord._id = "C" + String(Date.now());
        records.push(nextRecord);
        const remoteSaved = await persistProjectRecords(records);
        clearRecordForm();
        recordStatus.textContent = window.AKRemoteStore?.isConfigured
          ? (remoteSaved ? "Datensatz zentral gespeichert. Projekt 1 neu laden, um ihn anzuzeigen." : "Lokal gespeichert. Online-Speicher nicht erreichbar.")
          : "Datensatz lokal gespeichert. Projekt 1 neu laden, um ihn anzuzeigen.";
      };

      const contentKey = () => window.SiteContent.storageKey;
      const styleKey = () => window.SiteContent.styleKey;

      const setEditorOpen = (open) => {
        loginForm.classList.toggle("is-hidden", open);
        editorPanel.classList.toggle("is-open", open);
      };

      const getContent = () => readJson(contentKey());
      const getStyles = () => readJson(styleKey());

      const selectField = (field) => {
        activeField = field;
        const content = getContent();
        const styles = getStyles();
        const style = styles[field.id] || {};

        fieldName.value = field.page + " - " + field.label;
        fieldText.value = typeof content[field.id] === "string" ? content[field.id] : field.defaultText;
        fontSize.value = style.fontSize || "";
        fontColor.value = style.color || "#f7fbff";
        colorPreset.value = presetColors.includes(fontColor.value.toLowerCase()) ? fontColor.value.toLowerCase() : "";
        textAlign.value = style.textAlign || "";
        editorStatus.textContent = "";

        fieldList.querySelectorAll("button").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.fieldId === field.id);
        });
      };

      const renderFieldList = () => {
        fieldList.innerHTML = "";
        window.SiteContent.fields.forEach((field) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.fieldId = field.id;
          button.innerHTML = '<span class="field-page">' + field.page + '</span>' + field.label;
          button.addEventListener("click", () => selectField(field));
          fieldList.appendChild(button);
        });
        selectField(window.SiteContent.fields[0]);
      };

      const saveField = async () => {
        if (!activeField) return;
        const content = getContent();
        const styles = getStyles();
        content[activeField.id] = fieldText.value;
        styles[activeField.id] = {
          fontSize: fontSize.value || "",
          color: fontColor.value || "",
          textAlign: textAlign.value || "",
        };
        writeJson(contentKey(), content);
        writeJson(styleKey(), styles);
        window.SiteContent.applyContent();
        const remoteSaved = await window.SiteContent.saveRemoteContent(content, styles);
        editorStatus.textContent = window.AKRemoteStore?.isConfigured
          ? (remoteSaved ? "Zentral gespeichert." : "Lokal gespeichert. Online-Speicher nicht erreichbar.")
          : "Lokal gespeichert. Online-Speicher ist noch nicht konfiguriert.";
      };

      colorPreset.addEventListener("change", () => {
        if (colorPreset.value) fontColor.value = colorPreset.value;
      });

      fontColor.addEventListener("input", () => {
        const color = fontColor.value.toLowerCase();
        colorPreset.value = presetColors.includes(color) ? color : "";
      });

      const toggleBullets = () => {
        const start = fieldText.selectionStart;
        const end = fieldText.selectionEnd;
        const value = fieldText.value;
        const lineStart = value.lastIndexOf("\n", Math.max(0, start - 1)) + 1;
        const lineEndIndex = value.indexOf("\n", end);
        const lineEnd = lineEndIndex === -1 ? value.length : lineEndIndex;
        const selectedText = value.slice(lineStart, lineEnd);
        const lines = selectedText.split("\n");
        const hasBullets = lines
          .filter((line) => line.trim() !== "")
          .every((line) => /^\s*(?:[-•]\s+)/.test(line));
        const nextLines = lines.map((line) => {
          if (line.trim() === "") return line;
          if (hasBullets) return line.replace(/^(\s*)(?:[-•]\s+)/, "$1");
          return line.replace(/^(\s*)/, "$1- ");
        });
        const replacement = nextLines.join("\n");
        fieldText.value = value.slice(0, lineStart) + replacement + value.slice(lineEnd);
        fieldText.focus();
        fieldText.setSelectionRange(lineStart, lineStart + replacement.length);
        editorStatus.textContent = hasBullets ? "Aufzählung entfernt." : "Aufzählung eingefügt.";
      };

      const resetField = () => {
        if (!activeField) return;
        const content = getContent();
        const styles = getStyles();
        delete content[activeField.id];
        delete styles[activeField.id];
        writeJson(contentKey(), content);
        writeJson(styleKey(), styles);
        selectField(activeField);
        window.SiteContent.applyContent();
        editorStatus.textContent = "Feld zurückgesetzt.";
      };

      const resetAll = () => {
        localStorage.removeItem(contentKey());
        localStorage.removeItem(styleKey());
        selectField(activeField || window.SiteContent.fields[0]);
        window.SiteContent.applyContent();
        editorStatus.textContent = "Alle Textfelder wurden zurückgesetzt.";
      };

      const openEditor = async () => {
        localStorage.setItem(AUTH_KEY, "true");
        setEditorOpen(true);
        await window.SiteContent.loadRemoteContent();
        await refreshProjectRecordList();
        renderFieldList();
      };

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value;
        if (user === USERNAME && pass === PASSWORD) {
          openEditor();
          return;
        }
        loginStatus.textContent = "Benutzername oder Passwort ist falsch.";
      });

      document.getElementById("saveButton").addEventListener("click", saveField);
      document.getElementById("bulletButton").addEventListener("click", toggleBullets);
      document.getElementById("resetButton").addEventListener("click", resetField);
      document.getElementById("resetAllButton").addEventListener("click", resetAll);
      document.getElementById("recordSaveButton").addEventListener("click", saveProjectRecord);
      projectRecordSearch.addEventListener("input", renderProjectRecordList);
      document.getElementById("recordUpdateButton").addEventListener("click", updateProjectRecord);
      document.getElementById("recordDeleteButton").addEventListener("click", deleteProjectRecord);
      document.getElementById("recordClearButton").addEventListener("click", () => {
        clearRecordForm();
        recordStatus.textContent = "Felder geleert.";
      });
      document.getElementById("logoutButton").addEventListener("click", () => {
        localStorage.removeItem(AUTH_KEY);
        setEditorOpen(false);
      });

      const boot = () => {
        if (!window.SiteContent) {
          requestAnimationFrame(boot);
          return;
        }
        if (localStorage.getItem(AUTH_KEY) === "true") {
          openEditor();
        }
      };

      boot();
    })();
  </script>
</body>
</html>
