<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="assets/site-nav.css">
  <script src="assets/site-nav.js" defer></script>
  <script src="assets/site-content.js" defer></script>
  <title>Editor</title>
  <style>
    :root {
      --bg: #070812;
      --cyan: #00d9ff;
      --magenta: #ff2dfd;
      --violet: #6736ff;
      --yellow: #f8ff13;
      --orange: #ff9f1c;
      --text: #f7fbff;
      --muted: #9da7d7;
      --panel: rgba(14, 7, 35, 0.78);
      --shadow: 0 0 24px rgba(103, 54, 255, 0.45), 0 0 48px rgba(255, 45, 253, 0.24);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      font-weight: 400;
    }

    .editor-stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: 24px 26px;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(5, 7, 20, 0.58), rgba(5, 7, 20, 0.86)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.07), rgba(255, 45, 253, 0.11), rgba(248, 255, 19, 0.05));
    }

    .editor-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 5px),
        linear-gradient(180deg, rgba(3, 4, 14, 0.08), rgba(3, 4, 14, 0.64));
      pointer-events: none;
      z-index: -2;
    }

    .editor-shell {
      --shell-corner-depth: clamp(78px, 10vh, 112px);
      position: relative;
      width: min(1180px, 96vw);
      min-height: min(760px, calc(100vh - 48px));
      padding: 10px 22px 58px;
      clip-path: polygon(4.5% 0, 95.5% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 95.5% 100%, 4.5% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      background:
        linear-gradient(90deg, var(--yellow), var(--orange) 9%, var(--violet) 23%, var(--magenta) 51%, var(--violet) 76%, var(--cyan) 91%, var(--yellow)),
        linear-gradient(180deg, rgba(17, 8, 47, 0.96), rgba(5, 5, 18, 0.98));
      box-shadow: var(--shadow);
    }

    .editor-shell::before {
      content: "";
      position: absolute;
      inset: 3px;
      clip-path: inherit;
      background:
        linear-gradient(180deg, rgba(10, 6, 29, 0.95), rgba(8, 5, 24, 0.98)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.08), rgba(255, 45, 253, 0.08));
      z-index: -1;
    }

    .editor-title {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }

    .editor-title-chip {
      position: relative;
      min-width: 320px;
      padding: 13px 34px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(247, 251, 255, 0.96);
      font-weight: 400;
      text-transform: uppercase;
      background:
        linear-gradient(135deg, var(--yellow) 0 12px, transparent 12px) left top / 34px 34px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 12px, transparent 12px) right top / 34px 34px no-repeat,
        linear-gradient(45deg, #ff8a19 0 10px, transparent 10px) left bottom / 30px 30px no-repeat,
        linear-gradient(315deg, #ff8a19 0 10px, transparent 10px) right bottom / 30px 30px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.88), rgba(9, 14, 42, 0.96));
      border: 1px solid rgba(0, 217, 255, 0.8);
      clip-path: polygon(7% 0, 93% 0, 100% 50%, 93% 100%, 7% 100%, 0 50%);
      box-shadow: 0 0 26px rgba(0, 217, 255, 0.52), inset 0 0 16px rgba(0, 217, 255, 0.28);
      text-shadow: 0 0 12px rgba(0, 217, 255, 0.78);
    }

    .editor-subline {
      color: rgba(247, 251, 255, 0.88);
      font-size: 14px;
      text-transform: none;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.45);
    }

    .editor-content {
      position: relative;
      z-index: 2;
      max-width: 980px;
      margin: 0 auto;
    }

    .login-panel,
    .editor-panel {
      border: 1px solid rgba(0, 217, 255, 0.42);
      border-radius: 6px;
      background: rgba(2, 5, 20, 0.62);
      box-shadow: inset 0 0 18px rgba(0, 217, 255, 0.07);
    }

    .login-panel {
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .editor-panel {
      display: none;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }

    .editor-panel.is-open {
      display: grid;
    }

    .field-list {
      display: grid;
      gap: 8px;
      align-content: start;
      max-height: 620px;
      overflow: auto;
      padding-right: 4px;
    }

    .field-list button {
      min-height: 44px;
      padding: 10px 12px;
      color: rgba(247, 251, 255, 0.92);
      text-align: left;
      text-transform: none;
      background: rgba(13, 17, 50, 0.84);
      border: 1px solid rgba(0, 217, 255, 0.32);
      border-radius: 6px;
      cursor: pointer;
    }

    .field-list button.is-active {
      color: var(--yellow);
      border-color: rgba(248, 255, 19, 0.86);
      box-shadow: 0 0 18px rgba(248, 255, 19, 0.16);
    }

    .field-page {
      display: block;
      margin-bottom: 3px;
      color: var(--cyan);
      font-size: 11px;
      text-transform: uppercase;
    }

    .form-area {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .editor-label {
      display: grid;
      gap: 6px;
      color: var(--cyan);
      font-size: 12px;
    }

    .editor-input,
    .editor-textarea {
      width: 100%;
      color: rgba(247, 251, 255, 0.94);
      background: rgba(2, 5, 20, 0.72);
      border: 1px solid rgba(0, 217, 255, 0.42);
      border-radius: 6px;
      outline: none;
      text-transform: none;
      box-shadow: inset 0 0 16px rgba(0, 217, 255, 0.06);
    }

    .editor-input {
      min-height: 40px;
      padding: 8px 10px;
    }

    .editor-textarea {
      min-height: 320px;
      padding: 12px;
      resize: vertical;
      line-height: 1.45;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      min-height: 40px;
      padding: 9px 16px;
      color: rgba(247, 251, 255, 0.94);
      text-transform: uppercase;
      background: linear-gradient(180deg, rgba(255, 45, 253, 0.28), rgba(103, 54, 255, 0.18));
      border: 1px solid rgba(255, 45, 253, 0.66);
      border-radius: 5px;
      cursor: pointer;
      box-shadow: inset 0 0 14px rgba(255, 45, 253, 0.12);
    }

    .button:hover,
    .button:focus-visible {
      border-color: rgba(248, 255, 19, 0.9);
      outline: none;
    }

    .status {
      min-height: 18px;
      color: var(--yellow);
      font-size: 12px;
      text-transform: none;
    }

    .is-hidden {
      display: none;
    }

    @media (max-width: 820px) {
      .editor-stage {
        padding: 18px 12px 12px;
      }

      .editor-shell {
        --shell-corner-depth: 42px;
        width: min(100%, 96vw);
        padding: 10px 14px 44px;
        clip-path: polygon(3% 0, 97% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 97% 100%, 3% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      }

      .editor-title-chip {
        min-width: 0;
        width: 100%;
      }

      .editor-panel.is-open {
        grid-template-columns: 1fr;
      }

      .control-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="editor-stage">
    <section class="editor-shell" aria-label="Editor">
      <div class="editor-title">
        <div class="editor-title-chip">Editor</div>
        <div class="editor-subline">Texte und Darstellung bearbeiten</div>
      </div>

      <nav class="site-nav" data-active="editor" aria-label="Hauptnavigation"></nav>

      <div class="editor-content">
        <form class="login-panel" id="loginForm" autocomplete="off">
          <label class="editor-label">
            Benutzername
            <input class="editor-input" id="username" type="text" autocomplete="username">
          </label>
          <label class="editor-label">
            Passwort
            <input class="editor-input" id="password" type="password" autocomplete="current-password">
          </label>
          <button class="button" type="submit">Anmelden</button>
          <div class="status" id="loginStatus"></div>
        </form>

        <section class="editor-panel" id="editorPanel" aria-label="Texteditor">
          <div>
            <label class="editor-label">
              Textfelder
              <div class="field-list" id="fieldList"></div>
            </label>
          </div>

          <div class="form-area">
            <label class="editor-label">
              Ausgewähltes Textfeld
              <input class="editor-input" id="fieldName" type="text" readonly>
            </label>

            <label class="editor-label">
              Text
              <textarea class="editor-textarea" id="fieldText" spellcheck="false"></textarea>
            </label>

            <div class="control-row">
              <label class="editor-label">
                Schriftgröße
                <input class="editor-input" id="fontSize" type="number" min="10" max="48" step="1">
              </label>
              <label class="editor-label">
                Schriftfarbe
                <input class="editor-input" id="fontColor" type="color">
              </label>
            </div>

            <div class="action-row">
              <button class="button" id="saveButton" type="button">Speichern</button>
              <button class="button" id="resetButton" type="button">Feld zurücksetzen</button>
              <button class="button" id="resetAllButton" type="button">Alles zurücksetzen</button>
              <button class="button" id="logoutButton" type="button">Abmelden</button>
            </div>
            <div class="status" id="editorStatus"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const USERNAME = "Axel";
      const PASSWORD = "416114";
      const AUTH_KEY = "ak-ai-music-editor-auth-v1";
      let activeField = null;

      const loginForm = document.getElementById("loginForm");
      const loginStatus = document.getElementById("loginStatus");
      const editorPanel = document.getElementById("editorPanel");
      const fieldList = document.getElementById("fieldList");
      const fieldName = document.getElementById("fieldName");
      const fieldText = document.getElementById("fieldText");
      const fontSize = document.getElementById("fontSize");
      const fontColor = document.getElementById("fontColor");
      const editorStatus = document.getElementById("editorStatus");

      const readJson = (key) => {
        try {
          return JSON.parse(localStorage.getItem(key) || "{}");
        } catch (error) {
          return {};
        }
      };

      const writeJson = (key, value) => {
        localStorage.setItem(key, JSON.stringify(value));
      };

      const contentKey = () => window.SiteContent.storageKey;
      const styleKey = () => window.SiteContent.styleKey;

      const setEditorOpen = (open) => {
        loginForm.classList.toggle("is-hidden", open);
        editorPanel.classList.toggle("is-open", open);
      };

      const getContent = () => readJson(contentKey());
      const getStyles = () => readJson(styleKey());

      const selectField = (field) => {
        activeField = field;
        const content = getContent();
        const styles = getStyles();
        const style = styles[field.id] || {};

        fieldName.value = field.page + " - " + field.label;
        fieldText.value = typeof content[field.id] === "string" ? content[field.id] : field.defaultText;
        fontSize.value = style.fontSize || "";
        fontColor.value = style.color || "#f7fbff";
        editorStatus.textContent = "";

        fieldList.querySelectorAll("button").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.fieldId === field.id);
        });
      };

      const renderFieldList = () => {
        fieldList.innerHTML = "";
        window.SiteContent.fields.forEach((field) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.fieldId = field.id;
          button.innerHTML = '<span class="field-page">' + field.page + '</span>' + field.label;
          button.addEventListener("click", () => selectField(field));
          fieldList.appendChild(button);
        });
        selectField(window.SiteContent.fields[0]);
      };

      const saveField = () => {
        if (!activeField) return;
        const content = getContent();
        const styles = getStyles();
        content[activeField.id] = fieldText.value;
        styles[activeField.id] = {
          fontSize: fontSize.value || "",
          color: fontColor.value || "",
        };
        writeJson(contentKey(), content);
        writeJson(styleKey(), styles);
        window.SiteContent.applyContent();
        editorStatus.textContent = "Gespeichert.";
      };

      const resetField = () => {
        if (!activeField) return;
        const content = getContent();
        const styles = getStyles();
        delete content[activeField.id];
        delete styles[activeField.id];
        writeJson(contentKey(), content);
        writeJson(styleKey(), styles);
        selectField(activeField);
        window.SiteContent.applyContent();
        editorStatus.textContent = "Feld zurückgesetzt.";
      };

      const resetAll = () => {
        localStorage.removeItem(contentKey());
        localStorage.removeItem(styleKey());
        selectField(activeField || window.SiteContent.fields[0]);
        window.SiteContent.applyContent();
        editorStatus.textContent = "Alle Textfelder wurden zurückgesetzt.";
      };

      const openEditor = () => {
        localStorage.setItem(AUTH_KEY, "true");
        setEditorOpen(true);
        renderFieldList();
      };

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value;
        if (user === USERNAME && pass === PASSWORD) {
          openEditor();
          return;
        }
        loginStatus.textContent = "Benutzername oder Passwort ist falsch.";
      });

      document.getElementById("saveButton").addEventListener("click", saveField);
      document.getElementById("resetButton").addEventListener("click", resetField);
      document.getElementById("resetAllButton").addEventListener("click", resetAll);
      document.getElementById("logoutButton").addEventListener("click", () => {
        localStorage.removeItem(AUTH_KEY);
        setEditorOpen(false);
      });

      const boot = () => {
        if (!window.SiteContent) {
          requestAnimationFrame(boot);
          return;
        }
        if (localStorage.getItem(AUTH_KEY) === "true") {
          setEditorOpen(true);
          renderFieldList();
        }
      };

      boot();
    })();
  </script>
</body>
</html>
