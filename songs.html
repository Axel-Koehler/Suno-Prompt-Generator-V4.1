<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="assets/site-nav.css">
  <script src="assets/remote-config.js"></script>
  <script src="assets/remote-store.js"></script>
  <script src="assets/site-nav.js" defer></script>
  <script src="assets/site-content.js" defer></script>
  <title>Meine Song`s</title>
  <style>
    :root {
      --bg: #070812;
      --cyan: #00d9ff;
      --magenta: #ff2dfd;
      --violet: #6736ff;
      --yellow: #f8ff13;
      --orange: #ff9f1c;
      --text: #f7fbff;
      --muted: #9da7d7;
      --shadow: 0 0 24px rgba(103, 54, 255, 0.45), 0 0 48px rgba(255, 45, 253, 0.24);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      overflow-x: hidden;
    }

    button,
    input,
    audio {
      font: inherit;
    }

    .songs-stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: 24px 26px;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(5, 7, 20, 0.58), rgba(5, 7, 20, 0.86)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.07), rgba(255, 45, 253, 0.11), rgba(248, 255, 19, 0.05));
    }

    .songs-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 5px),
        linear-gradient(180deg, rgba(3, 4, 14, 0.08), rgba(3, 4, 14, 0.64));
      pointer-events: none;
      z-index: -2;
    }

    .songs-shell {
      --shell-corner-depth: clamp(78px, 10vh, 112px);
      position: relative;
      width: min(1180px, 96vw);
      min-height: min(760px, calc(100vh - 48px));
      padding: 10px 22px 58px;
      clip-path: polygon(4.5% 0, 95.5% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 95.5% 100%, 4.5% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      background:
        linear-gradient(90deg, var(--yellow), var(--orange) 9%, var(--violet) 23%, var(--magenta) 51%, var(--violet) 76%, var(--cyan) 91%, var(--yellow)),
        linear-gradient(180deg, rgba(17, 8, 47, 0.96), rgba(5, 5, 18, 0.98));
      box-shadow: var(--shadow);
    }

    .songs-shell::before {
      content: "";
      position: absolute;
      inset: 3px;
      clip-path: inherit;
      background:
        linear-gradient(180deg, rgba(10, 6, 29, 0.95), rgba(8, 5, 24, 0.98)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.08), rgba(255, 45, 253, 0.08));
      z-index: -1;
    }

    .songs-title {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }

    .songs-title-chip {
      position: relative;
      min-width: 380px;
      padding: 13px 34px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: rgba(247, 251, 255, 0.96);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0;
      background:
        linear-gradient(135deg, var(--yellow) 0 12px, transparent 12px) left top / 34px 34px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 12px, transparent 12px) right top / 34px 34px no-repeat,
        linear-gradient(45deg, #ff8a19 0 10px, transparent 10px) left bottom / 30px 30px no-repeat,
        linear-gradient(315deg, #ff8a19 0 10px, transparent 10px) right bottom / 30px 30px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.88), rgba(9, 14, 42, 0.96));
      border: 1px solid rgba(0, 217, 255, 0.8);
      box-shadow:
        0 0 26px rgba(0, 217, 255, 0.52),
        0 0 34px rgba(175, 25, 255, 0.36),
        inset 0 0 16px rgba(0, 217, 255, 0.28);
      clip-path: polygon(7% 0, 93% 0, 100% 50%, 93% 100%, 7% 100%, 0 50%);
      text-shadow: 0 0 12px rgba(0, 217, 255, 0.78);
      white-space: nowrap;
      isolation: isolate;
      overflow: hidden;
    }

    .songs-title-chip::before {
      content: "";
      position: absolute;
      inset: 5px 12px;
      border-top: 1px solid rgba(198, 31, 255, 0.78);
      border-bottom: 1px solid rgba(198, 31, 255, 0.78);
      clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%);
      box-shadow: inset 0 0 14px rgba(198, 31, 255, 0.32);
      pointer-events: none;
    }

    .songs-subline {
      color: rgba(247, 251, 255, 0.88);
      font-size: 14px;
      text-transform: none;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.45);
    }

    .songs-content {
      position: relative;
      z-index: 2;
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .song-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 12px;
      align-items: stretch;
    }

    .song-card {
      position: relative;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 9px;
      min-height: 178px;
      padding: 18px 16px 16px;
      border: 1px solid rgba(0, 217, 255, 0.72);
      background:
        linear-gradient(135deg, var(--yellow) 0 10px, transparent 10px) left top / 28px 28px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 10px, transparent 10px) right top / 28px 28px no-repeat,
        linear-gradient(45deg, var(--orange) 0 9px, transparent 9px) left bottom / 26px 26px no-repeat,
        linear-gradient(315deg, var(--orange) 0 9px, transparent 9px) right bottom / 26px 26px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.82), rgba(9, 14, 42, 0.96));
      clip-path: polygon(8% 0, 92% 0, 100% 17%, 100% 83%, 92% 100%, 8% 100%, 0 83%, 0 17%);
      box-shadow:
        0 0 18px rgba(0, 217, 255, 0.28),
        0 0 24px rgba(175, 25, 255, 0.2),
        inset 0 0 15px rgba(0, 217, 255, 0.16);
    }

    .song-card::before {
      content: "";
      position: absolute;
      inset: 7px 13px;
      border-top: 1px solid rgba(198, 31, 255, 0.72);
      border-bottom: 1px solid rgba(198, 31, 255, 0.72);
      clip-path: polygon(7% 0, 93% 0, 100% 50%, 93% 100%, 7% 100%, 0 50%);
      pointer-events: none;
    }

    .song-title {
      color: var(--cyan);
      font-size: 14px;
      line-height: 1.25;
      text-transform: none;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.42);
      overflow-wrap: anywhere;
    }

    .song-meta {
      color: var(--muted);
      font-size: 12px;
      text-transform: none;
    }

    .song-player {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
      align-self: end;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid rgba(0, 217, 255, 0.52);
      background: rgba(2, 5, 20, 0.46);
      clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%);
      box-shadow: inset 0 0 14px rgba(255, 45, 253, 0.1);
    }

    .song-spectrum {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.82;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: screen;
    }

    .song-player::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0, 217, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.1) 1px, transparent 1px),
        linear-gradient(rgba(255, 45, 253, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 45, 253, 0.06) 1px, transparent 1px);
      background-size:
        12px 12px,
        12px 12px,
        48px 48px,
        48px 48px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.46;
      mix-blend-mode: screen;
    }

    .song-player::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2, 5, 20, 0.68), rgba(2, 5, 20, 0.28), rgba(2, 5, 20, 0.68)),
        linear-gradient(180deg, rgba(2, 5, 20, 0.28), rgba(2, 5, 20, 0.76));
      pointer-events: none;
      z-index: 2;
    }

    .song-play {
      position: relative;
      z-index: 3;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: rgba(247, 251, 255, 0.96);
      background: linear-gradient(180deg, rgba(255, 45, 253, 0.3), rgba(103, 54, 255, 0.24));
      border: 1px solid rgba(0, 217, 255, 0.72);
      clip-path: polygon(18% 0, 82% 0, 100% 50%, 82% 100%, 18% 100%, 0 50%);
      cursor: pointer;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.72);
      box-shadow: inset 0 0 12px rgba(0, 217, 255, 0.16);
    }

    .song-play:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .song-progress {
      position: relative;
      z-index: 3;
      width: 100%;
      accent-color: var(--magenta);
      cursor: pointer;
    }

    .song-time {
      position: relative;
      z-index: 3;
      grid-column: 1 / -1;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      text-transform: none;
    }

    .song-load-status {
      position: relative;
      z-index: 3;
      grid-column: 1 / -1;
      color: var(--yellow);
      font-size: 12px;
      text-align: center;
      text-transform: none;
    }

    .song-player audio {
      display: none;
    }

    .song-empty {
      margin: 12px 0 0;
      padding: 16px;
      color: rgba(247, 251, 255, 0.82);
      text-transform: none;
      border: 1px solid rgba(0, 217, 255, 0.32);
      border-radius: 6px;
      background: rgba(2, 5, 20, 0.48);
    }

    @media (max-width: 1040px) {
      .song-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .songs-stage {
        padding: 18px 12px 12px;
      }

      .songs-shell {
        --shell-corner-depth: 42px;
        width: min(100%, 96vw);
        padding: 10px 14px 44px;
        clip-path: polygon(3% 0, 97% 0, 100% var(--shell-corner-depth), 100% calc(100% - var(--shell-corner-depth)), 97% 100%, 3% 100%, 0 calc(100% - var(--shell-corner-depth)), 0 var(--shell-corner-depth));
      }

      .songs-title-chip {
        min-width: 0;
        width: 100%;
      }

      .song-list {
        grid-template-columns: 1fr;
      }

      .song-player {
        grid-template-columns: 46px minmax(0, 1fr);
      }

      .song-time {
        grid-column: 1 / -1;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="songs-stage">
    <section class="songs-shell" aria-label="Meine Songs">
      <div class="songs-title">
        <div class="songs-title-chip">Meine Song`s</div>
        <div class="songs-subline">Die Zukunft der Musik: KI trifft Kreativität</div>
      </div>

      <nav class="site-nav" data-active="songs" aria-label="Hauptnavigation"></nav>

      <div class="songs-content">
        <div class="song-list" id="songList"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const songList = document.getElementById("songList");
      let activeAudio = null;
      const objectUrls = [];
      let sharedAudioContext = null;

      const getAudioContext = () => {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!sharedAudioContext) sharedAudioContext = new AudioContextClass();
        return sharedAudioContext;
      };

      const formatDate = (value) => {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleDateString("de-DE", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        });
      };

      const renderSongs = async () => {
        const songs = await window.AKRemoteStore?.listAudio?.([]) || [];
        songList.replaceChildren();

        if (!songs.length) {
          const empty = document.createElement("p");
          empty.className = "song-empty";
          empty.textContent = "Noch keine Songs vorhanden.";
          songList.appendChild(empty);
          return;
        }

        songs.forEach((song) => {
          const card = document.createElement("article");
          const title = document.createElement("div");
          const meta = document.createElement("div");
          const player = createSongPlayer(song);

          card.className = "song-card";
          title.className = "song-title";
          meta.className = "song-meta";

          title.textContent = song.title || song.filename || "Ohne Titel";
          meta.textContent = formatDate(song.uploadedAt);

          card.appendChild(title);
          if (meta.textContent) card.appendChild(meta);
          card.appendChild(player);
          songList.appendChild(card);
        });
      };

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const rest = Math.floor(seconds % 60).toString().padStart(2, "0");
        return minutes + ":" + rest;
      };

      function createSongPlayer(song) {
        const wrapper = document.createElement("div");
        const playButton = document.createElement("button");
        const progress = document.createElement("input");
        const time = document.createElement("div");
        const status = document.createElement("div");
        const spectrum = document.createElement("canvas");
        const audio = document.createElement("audio");
        let analyser = null;
        let frequencyData = null;
        let animationFrame = 0;

        wrapper.className = "song-player";
        playButton.className = "song-play";
        progress.className = "song-progress";
        time.className = "song-time";
        status.className = "song-load-status";
        spectrum.className = "song-spectrum";

        playButton.type = "button";
        playButton.textContent = "▶";
        progress.type = "range";
        progress.min = "0";
        progress.max = "1000";
        progress.value = "0";
        time.textContent = "0:00 / 0:00";
        status.textContent = "Bereit";
        audio.preload = "metadata";

        const resizeSpectrum = () => {
          const rect = wrapper.getBoundingClientRect();
          const scale = window.devicePixelRatio || 1;
          const width = Math.max(1, Math.floor(rect.width * scale));
          const height = Math.max(1, Math.floor(rect.height * scale));
          if (spectrum.width !== width || spectrum.height !== height) {
            spectrum.width = width;
            spectrum.height = height;
          }
        };

        const drawIdleSpectrum = () => {
          resizeSpectrum();
          const canvas = spectrum.getContext("2d");
          if (!canvas) return;
          const width = spectrum.width;
          const height = spectrum.height;
          canvas.clearRect(0, 0, width, height);
          const center = height * 0.52;
          const points = 72;
          canvas.lineWidth = Math.max(1, width * 0.006);
          canvas.strokeStyle = "rgba(0, 217, 255, 0.42)";
          canvas.shadowColor = "rgba(0, 217, 255, 0.4)";
          canvas.shadowBlur = 8;
          canvas.beginPath();
          for (let index = 0; index <= points; index += 1) {
            const ratio = index / points;
            const x = ratio * width;
            const y = center + Math.sin(ratio * Math.PI * 6) * height * 0.08 + Math.sin(ratio * Math.PI * 13) * height * 0.025;
            if (index === 0) canvas.moveTo(x, y);
            else canvas.lineTo(x, y);
          }
          canvas.stroke();
        };

        const drawSpectrum = () => {
          resizeSpectrum();
          const canvas = spectrum.getContext("2d");
          if (!canvas || !analyser || !frequencyData) return;
          analyser.getByteFrequencyData(frequencyData);

          const width = spectrum.width;
          const height = spectrum.height;
          const points = 96;
          const step = Math.max(1, Math.floor(frequencyData.length / points));
          const center = height * 0.52;
          canvas.clearRect(0, 0, width, height);

          const strokeLine = (offset, color, blur, widthMultiplier) => {
            canvas.beginPath();
            canvas.strokeStyle = color;
            canvas.lineWidth = Math.max(1, width * widthMultiplier);
            canvas.shadowColor = color;
            canvas.shadowBlur = blur;
            for (let index = 0; index <= points; index += 1) {
              const sampleIndex = Math.min(frequencyData.length - 1, index * step);
              const value = frequencyData[sampleIndex] || 0;
              const intensity = value / 255;
              const x = (index / points) * width;
              const wave = Math.sin((index / points) * Math.PI * 8 + audio.currentTime * 5) * height * 0.035;
              const y = center + offset - intensity * height * 0.32 + wave;
              if (index === 0) canvas.moveTo(x, y);
              else canvas.lineTo(x, y);
            }
            canvas.stroke();
          };

          strokeLine(0, "rgba(0, 217, 255, 0.94)", 14, 0.007);
          strokeLine(height * 0.09, "rgba(255, 45, 253, 0.68)", 10, 0.004);
          strokeLine(-height * 0.08, "rgba(248, 255, 19, 0.5)", 8, 0.003);

          canvas.fillStyle = "rgba(0, 217, 255, 0.13)";
          canvas.beginPath();
          canvas.moveTo(0, center);
          for (let index = 0; index <= points; index += 1) {
            let value = 0;
            for (let offset = 0; offset < step; offset += 1) value += frequencyData[index * step + offset] || 0;
            const intensity = value / step / 255;
            const x = (index / points) * width;
            const y = center - intensity * height * 0.24;
            canvas.lineTo(x, y);
          }
          canvas.lineTo(width, center);
          canvas.closePath();
          canvas.fill();

          animationFrame = requestAnimationFrame(drawSpectrum);
        };

        const stopSpectrum = () => {
          if (animationFrame) cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          drawIdleSpectrum();
        };

        const startSpectrum = async () => {
          const audioContext = getAudioContext();
          if (!audioContext) return;
          if (audioContext.state === "suspended") await audioContext.resume();
          if (!analyser) {
            const source = audioContext.createMediaElementSource(audio);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.78;
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            frequencyData = new Uint8Array(analyser.frequencyBinCount);
          }
          if (!animationFrame) drawSpectrum();
        };

        const ensureAudioLoaded = async () => {
          if (audio.src) return true;
          playButton.disabled = true;
          status.textContent = "Lade Audiodatei...";
          const blob = await window.AKRemoteStore?.fetchAudioBlob?.(song.id);
          if (!blob) {
            status.textContent = "Audiodatei konnte nicht geladen werden.";
            playButton.disabled = false;
            return false;
          }
          const objectUrl = URL.createObjectURL(blob);
          objectUrls.push(objectUrl);
          audio.src = objectUrl;
          status.textContent = "";
          playButton.disabled = false;
          return true;
        };

        playButton.addEventListener("click", async () => {
          const loaded = await ensureAudioLoaded();
          if (!loaded) return;
          if (activeAudio && activeAudio !== audio) activeAudio.pause();
          if (audio.paused) {
            await startSpectrum();
            await audio.play();
            activeAudio = audio;
          } else {
            audio.pause();
          }
        });

        audio.addEventListener("play", () => {
          playButton.textContent = "II";
          startSpectrum();
        });

        audio.addEventListener("pause", () => {
          playButton.textContent = "▶";
        });

        audio.addEventListener("ended", () => {
          playButton.textContent = "▶";
          progress.value = "0";
        });

        audio.addEventListener("pause", stopSpectrum);
        audio.addEventListener("ended", stopSpectrum);

        audio.addEventListener("timeupdate", () => {
          const duration = audio.duration || 0;
          progress.value = duration ? String(Math.round((audio.currentTime / duration) * 1000)) : "0";
          time.textContent = formatTime(audio.currentTime) + " / " + formatTime(duration);
        });

        audio.addEventListener("loadedmetadata", () => {
          time.textContent = "0:00 / " + formatTime(audio.duration || 0);
        });

        progress.addEventListener("input", () => {
          if (!audio.duration) return;
          audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
        });

        drawIdleSpectrum();
        window.addEventListener("resize", drawIdleSpectrum);

        wrapper.appendChild(spectrum);
        wrapper.appendChild(playButton);
        wrapper.appendChild(progress);
        wrapper.appendChild(time);
        wrapper.appendChild(status);
        wrapper.appendChild(audio);
        return wrapper;
      }

      window.addEventListener("beforeunload", () => {
        objectUrls.forEach((url) => URL.revokeObjectURL(url));
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", renderSongs, { once: true });
      } else {
        renderSongs();
      }
    })();
  </script>
</body>
</html>
