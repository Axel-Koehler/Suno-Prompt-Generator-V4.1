<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="assets/site-nav.css">
  <script src="assets/remote-config.js"></script>
  <script src="assets/remote-store.js"></script>
  <script src="assets/site-nav.js" defer></script>
  <script src="assets/site-content.js" defer></script>
  <title>Meine Song`s</title>
  <style>
    :root {
      --bg: #070812;
      --cyan: #00d9ff;
      --magenta: #ff2dfd;
      --violet: #6736ff;
      --yellow: #f8ff13;
      --orange: #ff9f1c;
      --text: #f7fbff;
      --muted: #9da7d7;
      --shadow: 0 0 24px rgba(103, 54, 255, 0.45), 0 0 48px rgba(255, 45, 253, 0.24);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      overflow-x: hidden;
    }

    button,
    input,
    audio {
      font: inherit;
    }

    .songs-stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: 24px 26px;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(5, 7, 20, 0.58), rgba(5, 7, 20, 0.86)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.07), rgba(255, 45, 253, 0.11), rgba(248, 255, 19, 0.05));
    }

    .songs-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 5px),
        linear-gradient(180deg, rgba(3, 4, 14, 0.08), rgba(3, 4, 14, 0.64));
      pointer-events: none;
      z-index: -2;
    }

    .songs-shell {
      --shell-corner-depth: clamp(78px, 10vh, 112px);
      position: relative;
      width: min(1420px, 97vw);
      min-height: min(760px, calc(100vh - 48px));
      padding: 10px 22px 58px;
      clip-path: none;
      border-radius: 14px;
      background:
        linear-gradient(90deg, var(--yellow), var(--orange) 9%, var(--violet) 23%, var(--magenta) 51%, var(--violet) 76%, var(--cyan) 91%, var(--yellow)),
        linear-gradient(180deg, rgba(17, 8, 47, 0.96), rgba(5, 5, 18, 0.98));
      box-shadow: var(--shadow);
    }

    .songs-shell::before {
      content: "";
      position: absolute;
      inset: 3px;
      clip-path: none;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(10, 6, 29, 0.95), rgba(8, 5, 24, 0.98)),
        linear-gradient(90deg, rgba(0, 217, 255, 0.08), rgba(255, 45, 253, 0.08));
      z-index: -1;
    }

    .songs-title {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }

    .songs-title-chip {
      position: relative;
      min-width: 380px;
      padding: 13px 34px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: rgba(247, 251, 255, 0.96);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0;
      background:
        linear-gradient(135deg, var(--yellow) 0 12px, transparent 12px) left top / 34px 34px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 12px, transparent 12px) right top / 34px 34px no-repeat,
        linear-gradient(45deg, #ff8a19 0 10px, transparent 10px) left bottom / 30px 30px no-repeat,
        linear-gradient(315deg, #ff8a19 0 10px, transparent 10px) right bottom / 30px 30px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.88), rgba(9, 14, 42, 0.96));
      border: 1px solid rgba(0, 217, 255, 0.8);
      box-shadow:
        0 0 26px rgba(0, 217, 255, 0.52),
        0 0 34px rgba(175, 25, 255, 0.36),
        inset 0 0 16px rgba(0, 217, 255, 0.28);
      clip-path: none;
      border-radius: 14px;
      text-shadow: 0 0 12px rgba(0, 217, 255, 0.78);
      white-space: nowrap;
      isolation: isolate;
      overflow: hidden;
    }

    .songs-title-chip::before {
      content: "";
      position: absolute;
      inset: 5px 12px;
      border-top: 1px solid rgba(198, 31, 255, 0.78);
      border-bottom: 1px solid rgba(198, 31, 255, 0.78);
      clip-path: none;
      border-radius: 14px;
      box-shadow: inset 0 0 14px rgba(198, 31, 255, 0.32);
      pointer-events: none;
    }

    .songs-subline {
      color: rgba(247, 251, 255, 0.88);
      font-size: 14px;
      text-transform: none;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.45);
    }

    .songs-content {
      position: relative;
      z-index: 2;
      width: min(1320px, 100%);
      margin: 0 auto;
    }

    .songs-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 0 0 12px;
    }

    .song-action-button {
      min-height: 42px;
      padding: 10px 18px;
      border: 1px solid rgba(0, 217, 255, 0.72);
      color: rgba(247, 251, 255, 0.96);
      text-transform: uppercase;
      background:
        linear-gradient(135deg, var(--yellow) 0 9px, transparent 9px) left top / 24px 24px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 9px, transparent 9px) right top / 24px 24px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.82), rgba(9, 14, 42, 0.96));
      clip-path: none;
      border-radius: 14px;
      box-shadow: 0 0 18px rgba(0, 217, 255, 0.28), inset 0 0 14px rgba(255, 45, 253, 0.14);
      cursor: pointer;
    }

    .song-action-button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .songs-master-volume {
      display: grid;
      gap: 5px;
      min-width: min(260px, 100%);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .songs-master-volume input {
      width: 100%;
      accent-color: var(--cyan);
    }

    .song-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 12px;
      align-items: stretch;
    }

    .song-card {
      position: relative;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 9px;
      min-height: 178px;
      padding: 18px 16px 16px;
      border: 1px solid rgba(0, 217, 255, 0.72);
      background:
        linear-gradient(135deg, var(--yellow) 0 10px, transparent 10px) left top / 28px 28px no-repeat,
        linear-gradient(225deg, var(--yellow) 0 10px, transparent 10px) right top / 28px 28px no-repeat,
        linear-gradient(45deg, var(--orange) 0 9px, transparent 9px) left bottom / 26px 26px no-repeat,
        linear-gradient(315deg, var(--orange) 0 9px, transparent 9px) right bottom / 26px 26px no-repeat,
        linear-gradient(90deg, rgba(9, 14, 42, 0.96), rgba(64, 12, 137, 0.82), rgba(9, 14, 42, 0.96));
      clip-path: none;
      border-radius: 14px;
      box-shadow:
        0 0 18px rgba(0, 217, 255, 0.28),
        0 0 24px rgba(175, 25, 255, 0.2),
        inset 0 0 15px rgba(0, 217, 255, 0.16);
    }

    .song-card::before {
      content: "";
      position: absolute;
      inset: 7px 13px;
      border-top: 1px solid rgba(198, 31, 255, 0.72);
      border-bottom: 1px solid rgba(198, 31, 255, 0.72);
      clip-path: none;
      border-radius: 14px;
      pointer-events: none;
    }

    .song-title {
      color: var(--cyan);
      font-size: 14px;
      line-height: 1.25;
      text-transform: none;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.42);
      overflow-wrap: anywhere;
    }

    .song-analysis {
      display: inline;
      color: rgba(248, 255, 19, 0.92);
      font-size: 12px;
      text-shadow: 0 0 9px rgba(248, 255, 19, 0.22);
    }

    .song-meta {
      color: var(--muted);
      font-size: 12px;
      text-transform: none;
    }

    .song-player {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
      align-self: end;
      align-items: center;
      min-height: 96px;
      padding: 9px 10px;
      border: 1px solid rgba(0, 217, 255, 0.52);
      background: rgba(2, 5, 20, 0.46);
      clip-path: none;
      border-radius: 14px;
      box-shadow: inset 0 0 14px rgba(255, 45, 253, 0.1);
    }

    .song-spectrum {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.82;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: screen;
    }

    .song-player::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0, 217, 255, 0.26) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.22) 1px, transparent 1px),
        linear-gradient(rgba(255, 45, 253, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 45, 253, 0.16) 1px, transparent 1px);
      background-size:
        12px 12px,
        12px 12px,
        48px 48px,
        48px 48px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.72;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 3px rgba(0, 217, 255, 0.28));
    }

    .song-player::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2, 5, 20, 0.68), rgba(2, 5, 20, 0.28), rgba(2, 5, 20, 0.68)),
        linear-gradient(180deg, rgba(2, 5, 20, 0.28), rgba(2, 5, 20, 0.76));
      pointer-events: none;
      z-index: 2;
    }

    .song-play {
      position: relative;
      z-index: 3;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: rgba(247, 251, 255, 0.96);
      background: linear-gradient(180deg, rgba(255, 45, 253, 0.3), rgba(103, 54, 255, 0.24));
      border: 1px solid rgba(0, 217, 255, 0.72);
      clip-path: none;
      border-radius: 14px;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.72);
      box-shadow: inset 0 0 12px rgba(0, 217, 255, 0.16);
    }

    .song-play:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .song-progress {
      position: relative;
      z-index: 3;
      width: 100%;
      accent-color: var(--magenta);
      cursor: pointer;
    }

    .song-time {
      position: relative;
      z-index: 3;
      grid-column: 1 / -1;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      text-transform: none;
    }

    .song-load-status {
      position: relative;
      z-index: 3;
      grid-column: 1 / -1;
      min-height: 15px;
      color: var(--yellow);
      font-size: 12px;
      text-align: center;
      text-transform: none;
    }

    .song-player audio {
      display: none;
    }

    .song-empty {
      margin: 12px 0 0;
      padding: 16px;
      color: rgba(247, 251, 255, 0.82);
      text-transform: none;
      border: 1px solid rgba(0, 217, 255, 0.32);
      border-radius: 6px;
      background: rgba(2, 5, 20, 0.48);
    }

    @media (max-width: 1040px) {
      .song-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .songs-stage {
        padding: 18px 12px 12px;
      }

      .songs-shell {
        --shell-corner-depth: 42px;
        width: min(100%, 96vw);
        padding: 10px 14px 44px;
        clip-path: none;
      border-radius: 14px;
      }

      .songs-title-chip {
        min-width: 0;
        width: 100%;
      }

      .song-list {
        grid-template-columns: 1fr;
      }

      .song-player {
        grid-template-columns: 46px minmax(0, 1fr);
      }

      .song-time {
        grid-column: 1 / -1;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="songs-stage">
    <section class="songs-shell" aria-label="Meine Songs">
      <div class="songs-title">
        <div class="songs-title-chip">Meine Song`s</div>
        <div class="songs-subline">Die Zukunft der Musik: KI trifft KreativitÃ¤t</div>
      </div>

      <nav class="site-nav" data-active="songs" aria-label="Hauptnavigation"></nav>

      <div class="songs-content">
        <div class="songs-actions">
          <button class="song-action-button" id="playAllSongsButton" type="button" disabled>Alle Songs abspielen</button>
          <label class="songs-master-volume">
            LautstÃ¤rke alle Songs
            <input id="masterVolume" type="range" min="0" max="1" step="0.01" value="0.75">
          </label>
        </div>
        <div class="song-list" id="songList"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const songList = document.getElementById("songList");
      const playAllSongsButton = document.getElementById("playAllSongsButton");
      const masterVolume = document.getElementById("masterVolume");
      let activeAudio = null;
      const objectUrls = [];
      let sharedAudioContext = null;
      let songPlayers = [];
      let playAllSongsRunning = false;
      let sequentialSongIndex = -1;
      let masterVolumeValue = Number(masterVolume?.value || 0.75);
      const isAppleMobilePlayback = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const applyMasterVolumeToPlayer = (player) => {
        if (!player) return;
        if (player.audio) player.audio.volume = masterVolumeValue;
        if (player.gainNode) player.gainNode.gain.setTargetAtTime(masterVolumeValue, sharedAudioContext?.currentTime || 0, 0.015);
      };

      const getAudioContext = () => {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!sharedAudioContext) sharedAudioContext = new AudioContextClass();
        return sharedAudioContext;
      };

      const updateMediaSession = (song, audio) => {
        if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title || song.filename || "AK AI Music Studio",
          artist: "AK AI Music Studio",
          album: "Meine Song`s",
        });
        const handlers = {
          play: () => audio.play(),
          pause: () => audio.pause(),
          stop: () => {
            audio.pause();
            audio.currentTime = 0;
          },
          seekbackward: () => {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
          },
          seekforward: () => {
            audio.currentTime = Math.min(audio.duration || audio.currentTime, audio.currentTime + 10);
          },
        };
        Object.entries(handlers).forEach(([action, handler]) => {
          try {
            navigator.mediaSession.setActionHandler(action, handler);
          } catch (error) {
            // Some Safari versions expose only part of the Media Session API.
          }
        });
      };

      const formatDate = (value) => {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleDateString("de-DE", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        });
      };

      const renderSongs = async () => {
        const songs = await window.AKRemoteStore?.listAudio?.([]) || [];
        songList.replaceChildren();
        songPlayers = [];
        playAllSongsButton.disabled = !songs.length;

        if (!songs.length) {
          const empty = document.createElement("p");
          empty.className = "song-empty";
          empty.textContent = "Noch keine Songs vorhanden.";
          songList.appendChild(empty);
          return;
        }

        songs.forEach((song) => {
          const card = document.createElement("article");
          const title = document.createElement("div");
          const titleText = document.createElement("span");
          const analysis = document.createElement("span");
          const meta = document.createElement("div");
          const player = createSongPlayer(song, analysis);

          card.className = "song-card";
          title.className = "song-title";
          analysis.className = "song-analysis";
          meta.className = "song-meta";

          titleText.textContent = song.title || song.filename || "Ohne Titel";
          analysis.textContent = formatAnalysis(song.analysis);
          meta.textContent = formatDate(song.uploadedAt);
          title.appendChild(titleText);
          title.appendChild(analysis);

          card.appendChild(title);
          if (meta.textContent) card.appendChild(meta);
          card.appendChild(player);
          songList.appendChild(card);
          if (player.songPlayerApi) songPlayers.push(player.songPlayerApi);
        });
      };

      const analysisVersion = 4;
      const hasAnalysis = (analysis) => Boolean(
        analysis && analysis.version === analysisVersion && analysis.genre && analysis.subgenre && analysis.style
      );

      const formatAnalysis = (analysis) => {
        if (!hasAnalysis(analysis)) return " - Analyse laeuft...";
        const bpm = analysis.bpm ? " / " + analysis.bpm + " BPM" : "";
        const confidence = analysis.confidence ? " / Treffer: " + analysis.confidence : "";
        return " - " + [analysis.genre, analysis.subgenre, analysis.style].filter(Boolean).join(" / ") + bpm + confidence;
      };

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const rest = Math.floor(seconds % 60).toString().padStart(2, "0");
        return minutes + ":" + rest;
      };

      const analyzeAndStoreSong = async (song, analysisNode, existingBlob = null) => {
        if (!window.AKRemoteStore?.fetchAudioBlob || !window.AKRemoteStore?.updateAudioAnalysis) return;
        try {
          const blob = existingBlob || await window.AKRemoteStore.fetchAudioBlob(song.id);
          if (!blob) throw new Error("Audio konnte nicht geladen werden.");
          const analysis = await analyzeAudio(song, blob);
          song.analysis = analysis;
          analysisNode.textContent = formatAnalysis(analysis);
          await window.AKRemoteStore.updateAudioAnalysis(song.id, analysis);
        } catch (error) {
          analysisNode.textContent = " - Analyse nicht mÃ¶glich";
        }
      };

      const analyzeAudio = async (song, blob) => {
        const audioContext = getAudioContext();
        if (!audioContext) {
          return inferAnalysisFromText(song, {});
        }

        const buffer = await blob.arrayBuffer();
        const decoded = await audioContext.decodeAudioData(buffer.slice(0));
        const channel = decoded.getChannelData(0);
        const duration = decoded.duration || 0;
        const sampleRate = decoded.sampleRate || 44100;
        const maxSamples = Math.min(channel.length, sampleRate * 90);
        const step = Math.max(1, Math.floor(maxSamples / 9000));
        let sum = 0;
        let absSum = 0;
        let diffSum = 0;
        let peak = 0;
        let crossings = 0;
        let previous = channel[0] || 0;
        let previousAbs = Math.abs(previous);
        const envelope = [];
        const bucketSize = Math.max(1, Math.floor(sampleRate * 0.12));
        let bucketSum = 0;
        let bucketCount = 0;

        for (let index = 0; index < maxSamples; index += step) {
          const sample = channel[index] || 0;
          const abs = Math.abs(sample);
          sum += sample * sample;
          absSum += abs;
          diffSum += Math.abs(abs - previousAbs);
          if (abs > peak) peak = abs;
          if ((sample >= 0 && previous < 0) || (sample < 0 && previous >= 0)) crossings += 1;
          previous = sample;
          previousAbs = abs;
          bucketSum += abs;
          bucketCount += 1;
          if (index % bucketSize < step) {
            envelope.push(bucketSum / Math.max(1, bucketCount));
            bucketSum = 0;
            bucketCount = 0;
          }
        }

        const sampledCount = Math.max(1, Math.ceil(maxSamples / step));
        const rms = Math.sqrt(sum / sampledCount);
        const averageAbs = absSum / sampledCount;
        const brightness = Math.min(1, diffSum / Math.max(0.0001, absSum));
        const zcr = crossings / sampledCount;
        const tempo = estimateTempo(envelope);
        const transientRate = estimateTransientRate(envelope);
        const dynamics = peak / Math.max(0.0001, rms);
        const spectrum = analyzeFrequencyProfile(channel, sampleRate, maxSamples);
        return inferAnalysisFromText(song, { rms, zcr, tempo, dynamics, duration, brightness, averageAbs, transientRate, spectrum });
      };

      const analyzeFrequencyProfile = (channel, sampleRate, maxSamples) => {
        const windowSize = 2048;
        const sampleWindows = 14;
        const usableSamples = Math.max(windowSize, maxSamples - windowSize);
        const bands = [
          { key: "sub", min: 30, max: 60 },
          { key: "bass", min: 60, max: 160 },
          { key: "lowMid", min: 160, max: 400 },
          { key: "mid", min: 400, max: 1200 },
          { key: "highMid", min: 1200, max: 3200 },
          { key: "presence", min: 3200, max: 6500 },
          { key: "air", min: 6500, max: 12000 },
        ];
        const totals = Object.fromEntries(bands.map((band) => [band.key, 0]));
        let totalEnergy = 0;
        let weightedFrequency = 0;

        const goertzelPower = (start, frequency) => {
          const omega = (2 * Math.PI * frequency) / sampleRate;
          const coeff = 2 * Math.cos(omega);
          let q0 = 0;
          let q1 = 0;
          let q2 = 0;
          for (let offset = 0; offset < windowSize; offset += 1) {
            const sample = channel[start + offset] || 0;
            const window = 0.5 - 0.5 * Math.cos((2 * Math.PI * offset) / (windowSize - 1));
            q0 = coeff * q1 - q2 + sample * window;
            q2 = q1;
            q1 = q0;
          }
          return Math.max(0, q1 * q1 + q2 * q2 - coeff * q1 * q2);
        };

        for (let windowIndex = 0; windowIndex < sampleWindows; windowIndex += 1) {
          const ratio = sampleWindows === 1 ? 0 : windowIndex / (sampleWindows - 1);
          const start = Math.min(channel.length - windowSize, Math.max(0, Math.floor(ratio * usableSamples)));
          bands.forEach((band) => {
            const center = Math.sqrt(band.min * band.max);
            const power = goertzelPower(start, center);
            totals[band.key] += power;
            totalEnergy += power;
            weightedFrequency += power * center;
          });
        }

        const safeTotal = Math.max(0.000001, totalEnergy);
        const profile = Object.fromEntries(Object.entries(totals).map(([key, value]) => [key, value / safeTotal]));
        profile.centroid = weightedFrequency / safeTotal;
        profile.lowRatio = profile.sub + profile.bass;
        profile.midRatio = profile.lowMid + profile.mid + profile.highMid;
        profile.highRatio = profile.presence + profile.air;
        profile.warmth = profile.lowMid + profile.mid;
        profile.brightness = profile.highMid + profile.presence + profile.air;
        return profile;
      };

      const estimateTempo = (envelope) => {
        if (!envelope.length) return 0;
        const mean = envelope.reduce((sum, value) => sum + value, 0) / envelope.length;
        const peaks = [];
        envelope.forEach((value, index) => {
          if (index === 0 || index === envelope.length - 1) return;
          if (value > mean * 1.22 && value > envelope[index - 1] && value >= envelope[index + 1]) {
            peaks.push(index);
          }
        });
        if (peaks.length < 2) return 0;
        const gaps = [];
        for (let index = 1; index < peaks.length; index += 1) {
          const gap = peaks[index] - peaks[index - 1];
          if (gap > 1) gaps.push(gap);
        }
        if (!gaps.length) return 0;
        gaps.sort((a, b) => a - b);
        const medianGap = gaps[Math.floor(gaps.length / 2)];
        let bpm = 60 / (medianGap * 0.12);
        while (bpm < 70) bpm *= 2;
        while (bpm > 170) bpm /= 2;
        return bpm;
      };

      const estimateTransientRate = (envelope) => {
        if (envelope.length < 4) return 0;
        const mean = envelope.reduce((sum, value) => sum + value, 0) / envelope.length;
        let hits = 0;
        for (let index = 1; index < envelope.length; index += 1) {
          if (envelope[index] > mean * 1.35 && envelope[index] > envelope[index - 1] * 1.12) hits += 1;
        }
        return hits / envelope.length;
      };

      const inferAnalysisFromText = (song, features) => {
        const text = ((song.title || "") + " " + (song.filename || "")).toLocaleLowerCase("de");
        const bpm = Number(features.tempo) || 0;
        const zcr = Number(features.zcr) || 0;
        const rms = Number(features.rms) || 0;
        const dynamics = Number(features.dynamics) || 0;
        const brightness = Number(features.brightness) || 0;
        const transientRate = Number(features.transientRate) || 0;
        const spectrum = features.spectrum || {};
        const bassRatio = Number(spectrum.lowRatio) || 0;
        const midRatio = Number(spectrum.midRatio) || 0;
        const highRatio = Number(spectrum.highRatio) || 0;
        const spectralCentroid = Number(spectrum.centroid) || 0;
        const warmth = Number(spectrum.warmth) || 0;
        const scores = [
          { id: "edm", genre: "Electronic", subgenre: bpm >= 134 ? "EDM / Trance" : "Dance / Club", baseStyle: "club-orientiert, synthetisch, pulsierend", score: 0, patterns: /edm|dance|club|house|techno|trance|rave|festival/i },
          { id: "synth", genre: "Electronic", subgenre: bpm >= 110 ? "Synthwave / Electro Pop" : "Downtempo Synth", baseStyle: "neonartig, elektronisch, flaechig", score: 0, patterns: /synth|cyber|neon|retrowave|wave|electro/i },
          { id: "pop", genre: "Pop", subgenre: bpm >= 112 ? "Upbeat Pop" : "Melodic Pop", baseStyle: "eingaengig, hook-orientiert, klar strukturiert", score: 0, patterns: /pop|summer|heart|love|radio|hit|anthem/i },
          { id: "rock", genre: "Rock", subgenre: zcr > 0.085 ? "Alternative Rock" : "Pop Rock", baseStyle: "druckvoll, kantig, bandorientiert", score: 0, patterns: /rock|guitar|metal|punk|grunge|band|drive|riff/i },
          { id: "hiphop", genre: "Hip-Hop", subgenre: bpm < 95 ? "Trap / Slow Rap" : "Rap Groove", baseStyle: "beatbetont, basslastig, rhythmisch fokussiert", score: 0, patterns: /hip.?hop|rap|trap|drill|boom.?bap|808|beat/i },
          { id: "cinematic", genre: "Cinematic", subgenre: dynamics > 7 ? "Epic Score" : "Atmospheric Score", baseStyle: "weit, emotional, filmisch aufgebaut", score: 0, patterns: /cinema|cinematic|score|orchestra|epic|movie|trailer/i },
          { id: "ambient", genre: "Ambient", subgenre: highRatio > 0.24 ? "Space Ambient" : "Dark Ambient", baseStyle: "schwebend, atmosphaerisch, texturbetont", score: 0, patterns: /ambient|space|drone|meditation|calm|relax/i },
          { id: "rnb", genre: "R&B/Soul", subgenre: bpm && bpm < 96 ? "Slow Groove" : "Soul Pop", baseStyle: "warm, weich, groove-orientiert", score: 0, patterns: /r.?b|soul|blues|smooth|groove|slow jam/i },
          { id: "folk", genre: "Folk", subgenre: "Acoustic Folk", baseStyle: "organisch, erzaehlend, akustisch gepraegt", score: 0, patterns: /country|folk|acoustic|singer|songwriter|ballad/i },
          { id: "jazz", genre: "Jazz", subgenre: "Modern Jazz / Lounge", baseStyle: "locker, harmonisch reich, elegant", score: 0, patterns: /jazz|swing|lounge|bossa|latin|sax/i },
        ];
        const byId = Object.fromEntries(scores.map((entry) => [entry.id, entry]));
        const addScore = (id, value) => {
          if (byId[id]) byId[id].score += value;
        };

        scores.forEach((entry) => {
          if (entry.patterns.test(text)) entry.score += 11;
        });

        if (bpm >= 128) addScore("edm", 5);
        if (bpm >= 112 && bpm < 128) {
          addScore("pop", 4);
          addScore("synth", 2);
        }
        if (bpm > 0 && bpm < 92) {
          addScore("hiphop", 2);
          addScore("rnb", 4);
          addScore("ambient", 3);
          addScore("cinematic", dynamics > 7 ? 3 : 1);
        }
        if (rms > 0.09 && transientRate > 0.13) {
          addScore("edm", 4);
          addScore("rock", 3);
        }
        if (transientRate > 0.18 && bpm >= 110) addScore("edm", 3);
        if (bassRatio > 0.43 && bpm < 108) addScore("hiphop", 5);
        if (bassRatio > 0.36 && bpm >= 116) addScore("edm", 4);
        if (bassRatio > 0.3 && warmth > 0.44 && bpm < 108) addScore("rnb", 4);
        if ((brightness > 0.18 || zcr > 0.075) && highRatio > 0.26) addScore("rock", 5);
        if (highRatio > 0.32 && spectralCentroid > 2600 && bpm >= 105) addScore("synth", 3);
        if (spectralCentroid > 2800 && transientRate > 0.12) addScore("edm", 2);
        if (spectralCentroid < 1250 && dynamics > 7) addScore("cinematic", 5);
        if (rms < 0.055 && dynamics > 7) {
          addScore("cinematic", 4);
          addScore("ambient", 3);
        }
        if (midRatio > 0.62 && spectralCentroid < 1800) {
          addScore("folk", 4);
          addScore("jazz", 2);
        }
        if (warmth > 0.52 && bpm < 108) addScore("rnb", 4);
        if (warmth > 0.5 && highRatio < 0.2 && transientRate < 0.13) addScore("folk", 3);
        if (zcr < 0.045 && bpm > 0 && bpm < 105) addScore("rnb", 3);
        if (highRatio < 0.17 && transientRate < 0.1 && rms < 0.075) addScore("ambient", 4);
        if (bpm >= 95 && bpm <= 125 && warmth > 0.42 && highRatio > 0.22 && transientRate < 0.16) addScore("jazz", 3);

        scores.sort((a, b) => b.score - a.score);
        const best = scores[0];
        const second = scores.find((entry) => entry.genre !== best.genre && entry.score > 0);
        const isHybrid = second && best.score - second.score <= 3 && best.score >= 5;
        const tempoTag = bpm >= 132 ? "schnell" : bpm >= 112 ? "mittleres Uptempo" : bpm >= 92 ? "moderates Tempo" : bpm > 0 ? "langsames Tempo" : "freies Tempo";
        const energyTag = rms > 0.1 ? "sehr energiegeladen" : rms > 0.075 ? "kraftvoll" : rms > 0.052 ? "ausgewogen" : "zurueckhaltend";
        const bassTag = bassRatio > 0.43 ? "massiver Low-End-Fokus" : bassRatio > 0.32 ? "praesenter Bass" : bassRatio < 0.16 ? "leichter Bassbereich" : "";
        const toneTag = spectralCentroid > 3000 || highRatio > 0.34 ? "brillante Hoehen" : spectralCentroid < 1350 ? "dunkle Klangfarbe" : warmth > 0.5 ? "warme Mitten" : "ausgewogene Klangfarbe";
        const motionTag = transientRate > 0.18 ? "stark rhythmisch" : transientRate > 0.12 ? "klarer Groove" : dynamics > 8 ? "weite Dynamik" : "ruhiger Fluss";
        const hybridTag = isHybrid ? "mit " + second.genre + "-Einfluss" : "";
        const detailStyle = [
          best.score > 0 ? best.baseStyle : "melodisch, modern produziert",
          hybridTag,
          tempoTag,
          energyTag,
          bassTag,
          toneTag,
          motionTag,
        ].filter(Boolean).join(", ");
        return {
          version: analysisVersion,
          genre: isHybrid ? best.genre + " / " + second.genre : best.score > 0 ? best.genre : "Pop",
          subgenre: isHybrid ? best.subgenre + " mit " + second.subgenre : best.score > 0 ? best.subgenre : "Melodic AI Pop",
          style: detailStyle,
          bpm: bpm ? Math.round(bpm) : "",
          confidence: best.score >= 8 ? "hoch" : best.score >= 4 ? "mittel" : "niedrig",
        };
      };

      function createSongPlayer(song, analysisNode) {
        const wrapper = document.createElement("div");
        const playButton = document.createElement("button");
        const progress = document.createElement("input");
        const time = document.createElement("div");
        const status = document.createElement("div");
        const spectrum = document.createElement("canvas");
        const audio = document.createElement("audio");
        let analyser = null;
        let gainNode = null;
        let frequencyData = null;
        let animationFrame = 0;
        let previewData = null;

        wrapper.className = "song-player";
        playButton.className = "song-play";
        progress.className = "song-progress";
        time.className = "song-time";
        status.className = "song-load-status";
        spectrum.className = "song-spectrum";

        playButton.type = "button";
        playButton.textContent = "â–¶";
        progress.type = "range";
        progress.min = "0";
        progress.max = "1000";
        progress.value = "0";
        time.textContent = "0:00 / 0:00";
        status.textContent = "Bereit";
        audio.preload = "none";
        audio.setAttribute("playsinline", "");
        audio.setAttribute("webkit-playsinline", "");
        audio.volume = masterVolumeValue;

        const resizeSpectrum = () => {
          const rect = wrapper.getBoundingClientRect();
          const scale = window.devicePixelRatio || 1;
          const width = Math.max(1, Math.floor(rect.width * scale));
          const height = Math.max(1, Math.floor(rect.height * scale));
          if (spectrum.width !== width || spectrum.height !== height) {
            spectrum.width = width;
            spectrum.height = height;
          }
        };

        const drawIdleSpectrum = () => {
          resizeSpectrum();
          const canvas = spectrum.getContext("2d");
          if (!canvas) return;
          const width = spectrum.width;
          const height = spectrum.height;
          canvas.clearRect(0, 0, width, height);
          const center = height * 0.82;
          const points = previewData?.length ? previewData.length - 1 : 72;
          canvas.lineWidth = Math.max(1, width * 0.006);
          canvas.strokeStyle = "rgba(0, 217, 255, 0.42)";
          canvas.shadowColor = "rgba(0, 217, 255, 0.4)";
          canvas.shadowBlur = 8;
          canvas.beginPath();
          for (let index = 0; index <= points; index += 1) {
            const ratio = index / points;
            const x = ratio * width;
            const value = previewData?.[index] ?? (0.22 + Math.sin(ratio * Math.PI * 6) * 0.12 + Math.sin(ratio * Math.PI * 13) * 0.04);
            const y = center - value * height * 0.42 + Math.sin(ratio * Math.PI * 18) * height * 0.018;
            if (index === 0) canvas.moveTo(x, y);
            else canvas.lineTo(x, y);
          }
          canvas.stroke();
        };

        const buildPreviewData = async (blob) => {
          const audioContext = getAudioContext();
          if (!audioContext) return;
          try {
            const buffer = await blob.arrayBuffer();
            const decoded = await audioContext.decodeAudioData(buffer.slice(0));
            const channel = decoded.getChannelData(0);
            const points = 96;
            const blockSize = Math.max(1, Math.floor(channel.length / points));
            previewData = Array.from({ length: points }, (_, index) => {
              let sum = 0;
              let peak = 0;
              const start = index * blockSize;
              const end = Math.min(channel.length, start + blockSize);
              for (let sampleIndex = start; sampleIndex < end; sampleIndex += 1) {
                const sample = Math.abs(channel[sampleIndex]);
                sum += sample * sample;
                if (sample > peak) peak = sample;
              }
              const rms = Math.sqrt(sum / Math.max(1, end - start));
              return Math.min(1, rms * 3.2 + peak * 0.35);
            });
            drawIdleSpectrum();
          } catch (error) {
            console.warn("Spektrum-Vorschau konnte nicht erstellt werden.", error);
          }
        };

        const drawSpectrum = () => {
          resizeSpectrum();
          const canvas = spectrum.getContext("2d");
          if (!canvas || !analyser || !frequencyData) return;
          analyser.getByteFrequencyData(frequencyData);

          const width = spectrum.width;
          const height = spectrum.height;
          const points = 96;
          const center = height * 0.82;
          const minFrequency = 20;
          const maxFrequency = 12000;
          const nyquist = (sharedAudioContext?.sampleRate || 44100) / 2;
          const binFrequency = nyquist / frequencyData.length;
          const frequencyAt = (ratio) => minFrequency * Math.pow(maxFrequency / minFrequency, ratio);
          const valueAtPoint = (index) => {
            const ratio = index / points;
            const frequency = Math.min(maxFrequency, frequencyAt(ratio));
            const bin = Math.min(frequencyData.length - 1, Math.max(0, Math.round(frequency / binFrequency)));
            const lower = Math.max(0, bin - 1);
            const upper = Math.min(frequencyData.length - 1, bin + 1);
            return ((frequencyData[lower] || 0) + (frequencyData[bin] || 0) + (frequencyData[upper] || 0)) / 3;
          };
          canvas.clearRect(0, 0, width, height);

          const strokeLine = (offset, color, blur, widthMultiplier) => {
            canvas.beginPath();
            canvas.strokeStyle = color;
            canvas.lineWidth = Math.max(1, width * widthMultiplier);
            canvas.shadowColor = color;
            canvas.shadowBlur = blur;
            for (let index = 0; index <= points; index += 1) {
              const intensity = valueAtPoint(index) / 255;
              const x = (index / points) * width;
              const wave = Math.sin((index / points) * Math.PI * 8 + audio.currentTime * 5) * height * 0.035;
              const y = center + offset - intensity * height * 0.32 + wave;
              if (index === 0) canvas.moveTo(x, y);
              else canvas.lineTo(x, y);
            }
            canvas.stroke();
          };

          strokeLine(0, "rgba(0, 217, 255, 0.94)", 14, 0.007);
          strokeLine(height * 0.025, "rgba(255, 45, 253, 0.68)", 10, 0.004);
          strokeLine(-height * 0.12, "rgba(248, 255, 19, 0.5)", 8, 0.003);

          canvas.fillStyle = "rgba(0, 217, 255, 0.13)";
          canvas.beginPath();
          canvas.moveTo(0, center);
          for (let index = 0; index <= points; index += 1) {
            const intensity = valueAtPoint(index) / 255;
            const x = (index / points) * width;
            const y = center - intensity * height * 0.24;
            canvas.lineTo(x, y);
          }
          canvas.lineTo(width, center);
          canvas.closePath();
          canvas.fill();

          animationFrame = requestAnimationFrame(drawSpectrum);
        };

        const stopSpectrum = () => {
          if (animationFrame) cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          drawIdleSpectrum();
        };

        const startSpectrum = async () => {
          if (isAppleMobilePlayback) {
            drawIdleSpectrum();
            return;
          }
          const audioContext = getAudioContext();
          if (!audioContext) return;
          if (audioContext.state === "suspended") await audioContext.resume();
          if (!analyser) {
            const source = audioContext.createMediaElementSource(audio);
            analyser = audioContext.createAnalyser();
            gainNode = audioContext.createGain();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.78;
            gainNode.gain.value = masterVolumeValue;
            source.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(audioContext.destination);
            frequencyData = new Uint8Array(analyser.frequencyBinCount);
          }
          if (!animationFrame) drawSpectrum();
        };

        const ensureAudioLoaded = async () => {
          if (audio.src) return true;
          playButton.disabled = true;
          status.textContent = "Lade Audiodatei...";
          const blob = await window.AKRemoteStore?.fetchAudioBlob?.(song.id);
          if (!blob) {
            status.textContent = "Audiodatei konnte nicht geladen werden.";
            playButton.disabled = false;
            return false;
          }
          const objectUrl = URL.createObjectURL(blob);
          objectUrls.push(objectUrl);
          audio.src = objectUrl;
          buildPreviewData(blob);
          if (analysisNode && !hasAnalysis(song.analysis)) {
            analyzeAndStoreSong(song, analysisNode, blob);
          }
          status.textContent = "";
          playButton.disabled = false;
          return true;
        };

        const playFromStart = async () => {
          const loaded = await ensureAudioLoaded();
          if (!loaded) return false;
          if (activeAudio && activeAudio !== audio) activeAudio.pause();
          audio.currentTime = 0;
          await startSpectrum();
          try {
            updateMediaSession(song, audio);
            await audio.play();
            activeAudio = audio;
            return true;
          } catch (error) {
            status.textContent = "Wiedergabe bitte antippen.";
            return false;
          }
        };

        playButton.addEventListener("click", async () => {
          const loaded = await ensureAudioLoaded();
          if (!loaded) return;
          if (activeAudio && activeAudio !== audio) activeAudio.pause();
          if (audio.paused) {
            await startSpectrum();
            try {
              updateMediaSession(song, audio);
              await audio.play();
              activeAudio = audio;
            } catch (error) {
              status.textContent = "Wiedergabe bitte antippen.";
            }
          } else {
            audio.pause();
          }
        });

        audio.addEventListener("play", () => {
          playButton.textContent = "II";
          updateMediaSession(song, audio);
          startSpectrum();
        });

        audio.addEventListener("pause", () => {
          playButton.textContent = "â–¶";
        });

        audio.addEventListener("ended", () => {
          playButton.textContent = "â–¶";
          progress.value = "0";
          if (playAllSongsRunning) {
            const currentIndex = songPlayers.findIndex((player) => player.audio === audio);
            if (currentIndex === sequentialSongIndex) playSequentialAt(currentIndex + 1);
          }
        });

        audio.addEventListener("pause", stopSpectrum);
        audio.addEventListener("ended", stopSpectrum);

        audio.addEventListener("timeupdate", () => {
          const duration = audio.duration || 0;
          progress.value = duration ? String(Math.round((audio.currentTime / duration) * 1000)) : "0";
          time.textContent = formatTime(audio.currentTime) + " / " + formatTime(duration);
        });

        audio.addEventListener("loadedmetadata", () => {
          time.textContent = "0:00 / " + formatTime(audio.duration || 0);
        });

        progress.addEventListener("input", () => {
          if (!audio.duration) return;
          audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
        });

        drawIdleSpectrum();
        window.addEventListener("resize", drawIdleSpectrum);

        wrapper.appendChild(spectrum);
        wrapper.appendChild(playButton);
        wrapper.appendChild(progress);
        wrapper.appendChild(time);
        wrapper.appendChild(status);
        wrapper.appendChild(audio);
        wrapper.songPlayerApi = {
          audio,
          ensureAudioLoaded,
          playFromStart,
          get gainNode() {
            return gainNode;
          }
        };
        return wrapper;
      }

      const handleMasterVolumeChange = () => {
        masterVolumeValue = Number(masterVolume.value);
        songPlayers.forEach(applyMasterVolumeToPlayer);
      };

      masterVolume?.addEventListener("input", handleMasterVolumeChange);
      masterVolume?.addEventListener("change", handleMasterVolumeChange);
      masterVolume?.addEventListener("touchmove", handleMasterVolumeChange, { passive: true });

      const stopSequentialPlayback = () => {
        playAllSongsRunning = false;
        sequentialSongIndex = -1;
        if (activeAudio) activeAudio.pause();
        playAllSongsButton.textContent = "Alle Songs abspielen";
      };

      async function playSequentialAt(index) {
        if (!playAllSongsRunning) return;
        if (index >= songPlayers.length) {
          stopSequentialPlayback();
          return;
        }
        sequentialSongIndex = index;
        const player = songPlayers[index];
        const started = await player.playFromStart();
        if (!started && playAllSongsRunning) playSequentialAt(index + 1);
      }

      const playSongsSequentially = async () => {
        if (playAllSongsRunning) {
          stopSequentialPlayback();
          return;
        }

        playAllSongsRunning = true;
        playAllSongsButton.textContent = "Wiedergabe stoppen";
        await playSequentialAt(0);
      };

      playAllSongsButton.addEventListener("click", playSongsSequentially);

      window.addEventListener("beforeunload", () => {
        objectUrls.forEach((url) => URL.revokeObjectURL(url));
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", renderSongs, { once: true });
      } else {
        renderSongs();
      }
    })();
  </script>
</body>
